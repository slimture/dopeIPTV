<header class="bar">

    <a class="brand" href="{{v:brand_href}}"><span class="glyph">◉</span><b>dopeIPTV</b></a>
    <nav class="links">
{{b:navlinks}}{{b:langpick}}      <!-- The narrow-window menu. `name` makes the two disclosures an
           exclusive pair in browsers that support it, so opening one shuts
           the other with no script at all. -->
      <details class="navmenu" id="navMenu" name="hdrmenu">
        <summary aria-label="{{h:nav_menu}}">
          <span class="navmenu-bars" aria-hidden="true"><i></i><i></i><i></i></span>
        </summary>
        <div class="navmenu-panel" role="menu">
{{b:menuitems}}        </div>
      </details>
      <a class="btn primary" href="{{v:nav_base}}#download">{{h:nav_download_btn}}</a>
    </nav>
  </div>
</header>
