<!DOCTYPE html>
<html lang="{{v:lang}}" dir="{{v:dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{h:fl_meta_title}}</title>
<meta name="description" content="{{h:fl_meta_desc}}">
<link rel="canonical" href="{{v:canonical}}">
{{b:hreflang}}<meta name="theme-color" content="#151517">
<meta name="robots" content="index,follow">
<meta property="og:type" content="article">
<meta property="og:site_name" content="dopeIPTV">
<meta property="og:locale" content="{{v:locale}}">
<meta property="og:title" content="{{h:fl_meta_title}}">
<meta property="og:description" content="{{h:fl_meta_desc}}">
<meta property="og:url" content="{{v:canonical}}">
<meta property="og:image" content="https://dopeiptv.org/og-image.png?v=2">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/favicon.ico?v=2" sizes="32x32">
<link rel="icon" href="/favicon.png?v=2" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="{{v:css}}">
</head>
<body>
{{b:nav}}
<main id="top">
  <!-- Every feature of the app, a line each (site/features.json, the texts
       fl_* in site/lang/). Without script the whole list, the groups as
       links down the page; with features.js the groups filter it and the
       box searches it. -->
  <section class="help-top fl-top">
    <div class="wrap">
      <h1>{{h:fl_h1}}</h1>
      <p class="fl-lead">{{h:fl_lead}}</p>

      <div class="help-searchbar">
        <span class="help-mag" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle
          cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg></span>
        <input type="search" id="flSearch" autocomplete="off"
               placeholder="{{h:fl_search_ph}}"
               aria-label="{{h:fl_search_ph}}" aria-controls="flBody">
        <kbd class="help-key" aria-hidden="true">/</kbd>
        <button type="button" id="flClear" hidden
                aria-label="{{h:help_clear}}">✕</button>
      </div>
      <p class="help-count" id="flCount" hidden aria-live="polite"
         data-fmt="{{h:fl_hits}}"></p>
    </div>
  </section>

  <section class="fl-main">
    <div class="wrap">
      <div class="fl-layout">
        <nav class="fl-index" id="flIndex" aria-label="{{h:fl_index}}">
{{b:fl_index}}        </nav>

        <div class="fl-body" id="flBody">
{{b:fl_groups}}          <p class="help-none" id="flNone" hidden>{{h:fl_none}}</p>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="maker">
      <a class="sole" href="https://solecraft.se/" rel="noopener" aria-label="{{h:footer_built_by}}" data-tip="{{h:footer_built_by}}"><span class="sole-logo">Solecraft</span></a>
      <span class="v">dopeIPTV{{b:fl_version}} · © {{v:year}} Solecraft AB</span>
    </div>
    <nav>
      <a href="/">{{h:nav_download}}</a>
      <a href="/help/">{{h:nav_help}}</a>
      <a href="https://github.com/slimture/dopeIPTV">GitHub</a>
      <a href="https://github.com/slimture/dopeIPTV/releases">{{h:footer_releases}}</a>
      <a href="#feedback" data-feedback>{{h:foot_feedback}}</a>
      <a href="/privacy/">{{h:foot_privacy_terms}}</a>
    </nav>
{{v:company}}  </div>
</footer>
<script src="{{v:navjs}}" defer></script>
<script src="{{v:featjs}}" defer></script>
<script src="{{v:eventsjs}}" defer></script>
</body>
</html>
