name: CI

# Fast quality gate on every push and PR: lint (ruff, mypy) + the full pytest
# suite, in four parts at once.
# This is the green check to look at BEFORE tagging a release - it catches the
# class of breakage (undefined names, broken imports, failing tests) that used
# to only surface once a build ran. Kept separate from release.yml, which only
# runs on version tags.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on the same ref so a rapid push series doesn't queue.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + types
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26.04 from
    # 2026-10-19. Take a new image on purpose, with a green run, never by
    # surprise in the middle of a release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin ruff so a future release adding rules can't turn the gate red
          # without an intentional bump here.
          pip install "ruff==0.15.8" "mypy==1.18.2"
          # PyQt6 6.12's QtDBus.pyi has an invalid signature ("/" after "*").
          # Keep the type gate on a verified binding until that stub is fixed.
          pip install -r requirements.txt "PyQt6==6.10.2"
      - name: Ruff (lint)
        run: ruff check dopeiptv tests
      - name: Mypy (types, scoped to the logic modules)
        run: mypy

  tests:
    # The suite in four parts at once, each on a runner of its own
    # (tests/shard.py): a test file stays whole in one part, the parts made
    # even by what each file took on a whole run (tests/shard_times.json,
    # tools/shard_times.py). One runner took about 17 minutes for all of it.
    name: Tests ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      # The system libraries' packages (about 77 MB) kept between runs: from
      # Ubuntu's mirror they took one minute on a good run and eight on a
      # slow one. One copy per runner image and version of this file, so a
      # new image or another package list starts a new one. apt still reads
      # its signed lists from the mirror and takes only what the copy lacks;
      # a kept package is used only when its SHA-256 is the one those lists
      # name (apt itself checks a file in its cache by its size alone), so
      # nothing is installed that apt would not have installed from the
      # mirror. Only this test job: the release builds take theirs from the
      # mirror, as before.
      - name: The runner image, for the packages kept
        id: image
        run: echo "name=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: The system libraries' packages, kept from an earlier run
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25   # v5.1.0
        with:
          path: ~/apt-debs
          key: apt-${{ steps.image.outputs.name }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: System libraries for the PyQt6 import
        run: |
          # PyQt6 loads libEGL/libGL and xcb plugins at import time, so even a
          # headless test import needs these present (mirrors the release job).
          # libmpv2: the playback tests run a real mpv core against fake
          # servers and boxes (tests/test_nerd.py, test_boxes_playback.py).
          packages="libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0
            libxcb-shape0 libxcb-xkb1 libpulse0 libdbus-1-3
            libmpv2 ffmpeg desktop-file-utils"
          debs="$HOME/apt-debs"
          mkdir -p "$debs/partial"
          sudo apt-get update
          # A kept package stays only if the signed lists name it, by its
          # name, version and SHA-256; any other goes, and apt fetches it.
          kept=0 dropped=0
          for f in "$debs"/*.deb; do
            [ -e "$f" ] || continue
            # shellcheck disable=SC2016  # dpkg-deb's own format, not the shell's
            name=$(dpkg-deb --show --showformat='${Package}=${Version}' "$f" 2>/dev/null) || name=
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            if [ -n "$name" ] && apt-cache show "$name" 2>/dev/null | grep -qx "SHA256: $sum"; then
              kept=$((kept + 1))
            else
              rm -f "$f"; dropped=$((dropped + 1))
            fi
          done
          echo "Packages kept from an earlier run: $kept used, $dropped not"
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$debs" $packages
          # What the cache keeps: the packages, readable by this user.
          sudo rm -rf "$debs/partial" "$debs/lock"
          sudo chown -R "$(id -u):$(id -g)" "$debs"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt "PyQt6==6.10.2"
      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen   # no display on the runner
          DOPEIPTV_SHARD: ${{ matrix.shard }}/4
        run: pytest -q --durations=15

  lint-test:
    # The one check to look at, under the name it always had: green only
    # when the lint and every part of the suite are.
    name: Lint + tests
    if: always()
    needs: [lint, tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Lint and every part of the suite passed
        env:
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "lint: $LINT, tests: $TESTS"
          test "$LINT" = success && test "$TESTS" = success

  audit:
    # Known vulnerabilities in the Python packages the builds ship: the exact
    # versions of packaging/requirements-release.txt (every platform's) and
    # of the Flatpak's wheels, asked of PyPI's advisory database by pip-audit
    # (tools/audit_deps.py). A finding fails this job until the lock moves
    # to a fixed version - or packaging/audit-allowlist.txt accepts it, with
    # a reason and a date after which it fails again. An audit that did not
    # finish - the advisory service not reached after three tries, a package
    # left unchecked - fails too: nothing passes that was not checked.
    name: Known vulnerabilities in what is shipped
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: '3.12'
      - name: pip-audit, as pinned
        run: |
          python -m pip install --require-hashes -r packaging/requirements-pip.txt
          python -m pip install --require-hashes -r packaging/requirements-audit.txt
      - name: Audit
        run: python tools/audit_deps.py
