name: CI

# Fast quality gate on every push and PR: lint (ruff) + the full pytest suite.
# This is the green check to look at BEFORE tagging a release - it catches the
# class of breakage (undefined names, broken imports, failing tests) that used
# to only surface once a build ran. Kept separate from release.yml, which only
# runs on version tags.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on the same ref so a rapid push series doesn't queue.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint + tests
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26.04 from
    # 2026-10-19. Take a new image on purpose, with a green run, never by
    # surprise in the middle of a release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      - name: System libraries for the PyQt6 import
        run: |
          # PyQt6 loads libEGL/libGL and xcb plugins at import time, so even a
          # headless test import needs these present (mirrors the release job).
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xkb1 libpulse0 libdbus-1-3 \
            libmpv2 ffmpeg desktop-file-utils
          # libmpv2: the playback tests run a real mpv core against fake
          # servers and boxes (tests/test_nerd.py, test_boxes_playback.py).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin ruff so a future release adding rules can't turn the gate red
          # without an intentional bump here.
          pip install "ruff==0.15.8" "mypy==1.18.2" pytest
          # PyQt6 6.12's QtDBus.pyi has an invalid signature ("/" after "*").
          # Keep the type gate on a verified binding until that stub is fixed.
          pip install -r requirements.txt "PyQt6==6.10.2"
      - name: Ruff (lint)
        run: ruff check dopeiptv tests
      - name: Mypy (types, scoped to the logic modules)
        run: mypy
      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen   # no display on the runner
        run: pytest -q

  audit:
    # Known vulnerabilities in the Python packages the builds ship: the exact
    # versions of packaging/requirements-release.txt (every platform's) and
    # of the Flatpak's wheels, asked of PyPI's advisory database by pip-audit
    # (tools/audit_deps.py). A finding fails this job until the lock moves
    # to a fixed version - or packaging/audit-allowlist.txt accepts it, with
    # a reason and a date after which it fails again. An audit that did not
    # finish - the advisory service not reached after three tries, a package
    # left unchecked - fails too: nothing passes that was not checked.
    name: Known vulnerabilities in what is shipped
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: '3.12'
      - name: pip-audit, as pinned
        run: |
          python -m pip install --require-hashes -r packaging/requirements-pip.txt
          python -m pip install --require-hashes -r packaging/requirements-audit.txt
      - name: Audit
        run: python tools/audit_deps.py
