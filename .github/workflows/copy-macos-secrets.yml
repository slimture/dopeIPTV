# Once, by hand: the five Apple secrets copied from the repository's own
# secrets into the environment macos-signing (docs/MAINTAINING.md, "macOS
# signing"), since GitHub never shows a secret's value to copy it by hand.
# Needs COPY_TOKEN: a fine-grained token for this repository alone with
# Secrets and Environments read and write, expiring within a day. Afterwards
# delete COPY_TOKEN, the token itself, the five repository-wide secrets and
# this file. Nothing is printed: the values go from the runner's
# environment to gh's input, which GitHub masks in the log anyway.
#
# It runs when this file reaches testing - and fails at once while
# COPY_TOKEN is not there; "Re-run all jobs" on that run, once the token is
# saved, does the copy (a re-run reads the secrets as they are then). A
# workflow run by hand only shows its button from the default branch.
name: Copy macOS secrets (once)

on:
  push:
    branches: [testing]
    paths: ['.github/workflows/copy-macos-secrets.yml']
  workflow_dispatch:

permissions: {}

jobs:
  copy:
    runs-on: ubuntu-24.04
    steps:
      - name: Copy the five into macos-signing
        env:
          GH_TOKEN: ${{ secrets.COPY_TOKEN }}
          REPO: ${{ github.repository }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -eu
          [ -n "${GH_TOKEN}" ] || { echo "::error::COPY_TOKEN is not set"; exit 1; }
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            value=$(printenv "$name" || true)
            if [ -z "$value" ]; then
              echo "::error::$name is empty in the repository's secrets - nothing to copy"
              exit 1
            fi
            printf '%s' "$value" | gh secret set "$name" --env macos-signing --repo "$REPO"
            echo "$name copied"
          done
          gh secret list --env macos-signing --repo "$REPO"
