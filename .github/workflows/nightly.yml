name: Nightly

# Test builds of the testing branch, for Settings -> General -> Update
# channel -> Test builds. Every push to testing builds every package the
# way a release does (release.yml, called with nightly_version), versioned
# <release>.<run number> - 1.4.0.123: newer than 1.4.0, older than 1.4.1 -
# and publishes them as a pre-release tagged nightly-1.4.0.123. Pre-releases
# never show as the latest release, so the Releases channel and the website
# never see them. Only the newest few are kept.
on:
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: write

# A newer push makes the build in progress pointless.
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          BASE=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' dopeiptv/__init__.py)
          echo "version=${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Nightly ${BASE}.${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}"

  build:
    needs: version
    uses: ./.github/workflows/release.yml
    with:
      nightly_version: ${{ needs.version.outputs.version }}
    secrets: inherit

  tidy-notes:
    # The releases page short, so the downloads are near the top: each
    # release its own notes, the older ones folded (tools/tidy_release_notes.py).
    # Changes only what is not so yet; never holds up a build.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Tidy the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/tidy_release_notes.py

  publish:
    needs: [version, build]
    # What did build is published, as a release's jobs each attach theirs;
    # without the Linux AppImage there is no nightly at all.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      V: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Gather the packages
        id: gather
        run: |
          mkdir out
          find artifacts -type f \( -name '*.AppImage' -o -name '*.deb' \
            -o -name '*.dmg' -o -name '*.whl' -o -name '*.tar.gz' -o -name '*-setup.exe' \) \
            -exec cp {} out/ \;
          # Flatpak: the builder's artifact is named after the bundle only.
          f=$(find artifacts -type f -name '*.flatpak' | head -1)
          [ -n "$f" ] && cp "$f" "out/dopeIPTV-${V}.flatpak"
          # Windows: the artifact is the app folder; zip it as a release
          # does (one dopeiptv\ folder inside).
          for d in artifacts/dopeIPTV-windows-*; do
            [ -d "$d" ] || continue
            case "$d" in *-setup-*) continue ;; esac        # the installer, copied above
            arch="${d##*-}"
            rm -rf stage && mkdir -p stage/dopeiptv
            cp -r "$d"/. stage/dopeiptv/
            (cd stage && zip -qr "../out/dopeIPTV-${V}-windows-${arch}.zip" dopeiptv)
          done
          ls -la out
          # What did not build this time (a failed step - often a download
          # from GitHub or elsewhere that timed out) is named in the notes;
          # the run stays green, so a hiccup sends no failure mail. A
          # release (a tag) still fails loud.
          : > missing.txt
          for want in "x86_64.AppImage:AppImage (x86_64)" \
                      "aarch64.AppImage:AppImage (aarch64)" \
                      "amd64.deb:.deb (amd64)" "arm64.deb:.deb (arm64)" \
                      "macOS-arm64.dmg:macOS (Apple Silicon)" \
                      "macOS-x86_64.dmg:macOS (Intel)" \
                      "windows-x64.zip:Windows (x64)" \
                      "windows-arm64.zip:Windows (arm64)" \
                      "windows-x64-setup.exe:Windows installer (x64)" \
                      "windows-arm64-setup.exe:Windows installer (arm64)" \
                      ".flatpak:Flatpak" ".whl:wheel"; do
            pat="${want%%:*}"; name="${want#*:}"
            ls out/*"$pat" >/dev/null 2>&1 || echo "$name" >> missing.txt
          done
          if [ -s missing.txt ]; then
            echo "::warning::not built this time: $(paste -sd, missing.txt)"
          fi
          PUB=true
          if ! ls out/*x86_64.AppImage >/dev/null 2>&1; then
            # The test builds are for the AppImage above all: without it,
            # no nightly this time - the next push tries again.
            echo "::warning::no Linux AppImage - no nightly this time"
            PUB=false
          fi
          echo "publish=${PUB}" >> "$GITHUB_OUTPUT"
      - name: Sign the checksums
        if: steps.gather.outputs.publish == 'true'
        env:
          DOPEIPTV_UPDATE_KEY: ${{ secrets.DOPEIPTV_UPDATE_KEY }}
        run: |
          # The app installs an update only when its file is on this list,
          # signed with dopeIPTV's key (dopeiptv/core/update_keys.py) - so a
          # site or mirror taken over cannot serve one it accepts.
          (cd out && sha256sum -- * > ../SHA256SUMS)
          mv SHA256SUMS out/
          if [ -z "$DOPEIPTV_UPDATE_KEY" ]; then
            echo "::warning::DOPEIPTV_UPDATE_KEY is not set: this test build is not signed, and the app will not install it"
          else
            python3 tools/sign_sums.py out/SHA256SUMS
          fi
      - name: Notes
        if: steps.gather.outputs.publish == 'true'
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "## dopeIPTV ${V} (test build)"
            echo
            # One line a paragraph: GitHub shows a release's every line break.
            echo "Built from \`testing\` at ${GITHUB_SHA::7}, for testing what comes next - it can have faults a release does not. In the app: Settings -> General -> Update channel -> Test builds."
            echo
            if [ -s missing.txt ]; then
              echo "Not in this build (a step failed - see the run, ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}):"
              sed 's/^/- /' missing.txt
              echo
            fi
            # Folded: the releases page lists every build (and
            # tools/tidy_release_notes.py folds the ones from before).
            git log --no-merges --format='- %s' ${LAST:+$LAST..HEAD} | head -60 > changes.md
            N=$(wc -l < changes.md | tr -d ' ')
            echo "### Changes since ${LAST:-the last release}"
            echo
            echo "<details>"
            echo "<summary>${N} $([ "$N" = 1 ] && echo change || echo changes)</summary>"
            echo
            cat changes.md
            echo
            echo "</details>"
          } > notes.md
          cat notes.md
      - name: Publish the pre-release
        if: steps.gather.outputs.publish == 'true'
        run: |
          gh release create "nightly-${V}" out/* --prerelease --latest=false \
            --target "${GITHUB_SHA}" --title "dopeIPTV ${V} (test build)" \
            --notes-file notes.md
      - name: Keep the newest seven
        if: steps.gather.outputs.publish == 'true'
        run: |
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("nightly-")))]
                  | sort_by(.createdAt) | reverse | .[7:] | .[].tagName' |
          while read -r tag; do
            echo "removing ${tag}"
            gh release delete "${tag}" --yes --cleanup-tag
          done
