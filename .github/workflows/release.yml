name: Release

# Build the installable packages and attach them to the GitHub Release when a
# version tag (e.g. v0.3.0) is pushed. Each job uploads its own assets, so a
# failure in one format never blocks the others.
#
# nightly.yml calls this same workflow for the test builds of the testing
# branch, with nightly_version set (1.4.0.123): every job then stamps that
# version into the app before it builds, and nothing is attached here - the
# Attach steps only fire on a tag; nightly.yml publishes the artifacts as a
# pre-release itself.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      replace_macos_dmg:
        description: >-
          Rebuild only the macOS .dmg files and replace them on this
          published release (e.g. v1.4.4) - for a change to the build, such
          as signing, never to the app. Empty: a normal manual build.
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      nightly_version:
        type: string
        required: false
        default: ""
      # Never set by nightly.yml; declared so every job reads it alike.
      replace_macos_dmg:
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- Python ---
  python-dist:
    name: sdist + wheel (pipx / PyPI)
    if: ${{ (inputs.replace_macos_dmg || '') == '' }}
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26.04 from
    # 2026-10-19, and a release must not meet a new image unannounced.
    runs-on: ubuntu-24.04
    # A test build publishes what was built; a release fails loud.
    continue-on-error: ${{ (inputs.nightly_version || '') != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Nightly version
        if: ${{ inputs.nightly_version }}
        shell: bash
        env:
          V: ${{ inputs.nightly_version }}
        run: |
          # A test build is named and versioned after its build: the app,
          # the wheel and every package say 1.4.0.123, not 1.4.0.
          sed -i.bak -E "s/^__version__ = \"[^\"]*\"/__version__ = \"${V}\"/" dopeiptv/__init__.py
          sed -i.bak -E "s/^version = \"[^\"]*\"/version = \"${V}\"/" pyproject.toml
          rm -f dopeiptv/*.bak ./*.bak
          grep -q "^__version__ = \"${V}\"" dopeiptv/__init__.py
          grep -q "^version = \"${V}\"" pyproject.toml
          echo "Nightly build ${V}"
      - name: Guard - release notes must match this version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # The release body comes from RELEASE_NOTES.md and the artifacts are
          # built from whatever the tag points at, so three things must agree
          # or the release is a lie: the tag, the package version, the notes.
          #
          # v1.1.0 shipped with 1.0.0's notes because nothing checked the file.
          # v1.2.3 then shipped 1.2.2's code AND notes, because the tag landed
          # on a commit made before the version bump - and this guard only
          # compared the notes against __version__, which agreed with itself
          # perfectly at 1.2.2. Check the TAG too.
          TAG=${GITHUB_REF#refs/tags/v}
          VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' dopeiptv/__init__.py)
          if [ "${TAG}" != "${VER}" ]; then
            echo "::error::Tag v${TAG} sits on a commit whose __version__ is ${VER} - wrong commit, or the bump was never committed."
            exit 1
          fi
          if ! grep -q "dopeIPTV ${VER}" RELEASE_NOTES.md; then
            echo "::error::RELEASE_NOTES.md is stale: no 'dopeIPTV ${VER}' heading. Update it before tagging."
            exit 1
          fi
          echo "Tag, version and release notes all agree on ${VER}."
      - name: Bake built-in OpenSubtitles key
        shell: bash
        env:
          DOPEIPTV_OPENSUBTITLES_KEY: ${{ secrets.DOPEIPTV_OPENSUBTITLES_KEY }}
        run: |
          printf 'OPENSUBTITLES_API_KEY = "%s"\n' "${DOPEIPTV_OPENSUBTITLES_KEY}" > dopeiptv/_opensubtitles_key.py
          if [ -z "${DOPEIPTV_OPENSUBTITLES_KEY}" ]; then
            echo "::warning::DOPEIPTV_OPENSUBTITLES_KEY secret is empty - subtitles from OpenSubtitles need a key in Settings in this build."
          fi
      - name: Bake built-in TMDB key
        env:
          DOPEIPTV_TMDB_KEY: ${{ secrets.DOPEIPTV_TMDB_KEY }}
        run: |
          printf 'TMDB_API_KEY = "%s"\n' "${DOPEIPTV_TMDB_KEY}" > dopeiptv/_tmdb_key.py
          if [ -n "${DOPEIPTV_TMDB_KEY}" ]; then
            echo "Built-in TMDB key baked in (${#DOPEIPTV_TMDB_KEY} chars)."
          else
            echo "::warning::DOPEIPTV_TMDB_KEY secret is empty - the built-in TMDB option will NOT appear in this build."
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Smoke test - install wheel in a fresh venv
        run: |
          # Verify the wheel actually installs into a clean environment and
          # every import path is intact. PyQt6 loads libEGL/libGL at import
          # time, so the runner needs those system libraries even for a
          # headless import check - this mirrors what a real pipx user has
          # to install alongside the wheel (see the .deb depends list).
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxcb-cursor0 libpulse0 libdbus-1-3 \
            libxkbcommon0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c 'import dopeiptv, dopeiptv.app, dopeiptv.i18n, dopeiptv.ui.main_window; print("wheel imports OK, VERSION =", dopeiptv.VERSION)'
          # Every shipped language must load from the installed wheel - a
          # packaging slip here silently collapses the picker to English.
          /tmp/smoke/bin/python -c 'from dopeiptv.i18n import LANGUAGES, _NATIVE_NAMES; missing=[c for c in _NATIVE_NAMES if c not in LANGUAGES]; assert not missing, f"languages missing from wheel: {missing}"; print(f"wheel languages OK: {len(LANGUAGES)} loaded")'
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  # ------------------------------------------------ AppImage + Debian pkg ---
  linux-bundle:
    name: AppImage + .deb (${{ matrix.arch }})
    if: ${{ (inputs.replace_macos_dmg || '') == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64: build on the oldest supported glibc (2.35) so it runs
          # everywhere from Ubuntu 22.04 up. PyQt6's x86_64 wheel is
          # manylinux_2_34, which 22.04 (glibc 2.35) satisfies.
          #
          # Deliberately the OLDEST image still offered, because that is what
          # sets how old a distro the AppImage/.deb will run on - so this one
          # stays until it has to move. Deprecation starts 2026-09-17 and it
          # is gone by 2027-04-17; moving to 24.04 raises the glibc floor to
          # 2.39 and drops Ubuntu 22.04 / Debian 12 users, so that is a
          # decision to take deliberately, not to discover from a red build.
          - arch: x86_64
            runs_on: ubuntu-22.04
            test_distros: "ubuntu:22.04 ubuntu:24.04 debian:12 debian:13"
          # aarch64: PyQt6's arm64 wheel is manylinux_2_39, so we MUST build
          # on glibc >= 2.39 (Ubuntu 24.04). That makes 24.04 the floor for
          # the ARM build, so only test it on distros that new.
          - arch: aarch64
            runs_on: ubuntu-24.04-arm
            test_distros: "ubuntu:24.04 debian:13"
    runs-on: ${{ matrix.runs_on }}
    continue-on-error: ${{ (inputs.nightly_version || '') != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Nightly version
        if: ${{ inputs.nightly_version }}
        shell: bash
        env:
          V: ${{ inputs.nightly_version }}
        run: |
          # A test build is named and versioned after its build: the app,
          # the wheel and every package say 1.4.0.123, not 1.4.0.
          sed -i.bak -E "s/^__version__ = \"[^\"]*\"/__version__ = \"${V}\"/" dopeiptv/__init__.py
          sed -i.bak -E "s/^version = \"[^\"]*\"/version = \"${V}\"/" pyproject.toml
          rm -f dopeiptv/*.bak ./*.bak
          grep -q "^__version__ = \"${V}\"" dopeiptv/__init__.py
          grep -q "^version = \"${V}\"" pyproject.toml
          echo "Nightly build ${V}"
      - name: Guard - release notes must match this version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # The release body comes from RELEASE_NOTES.md and the artifacts are
          # built from whatever the tag points at, so three things must agree
          # or the release is a lie: the tag, the package version, the notes.
          #
          # v1.1.0 shipped with 1.0.0's notes because nothing checked the file.
          # v1.2.3 then shipped 1.2.2's code AND notes, because the tag landed
          # on a commit made before the version bump - and this guard only
          # compared the notes against __version__, which agreed with itself
          # perfectly at 1.2.2. Check the TAG too.
          TAG=${GITHUB_REF#refs/tags/v}
          VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' dopeiptv/__init__.py)
          if [ "${TAG}" != "${VER}" ]; then
            echo "::error::Tag v${TAG} sits on a commit whose __version__ is ${VER} - wrong commit, or the bump was never committed."
            exit 1
          fi
          if ! grep -q "dopeIPTV ${VER}" RELEASE_NOTES.md; then
            echo "::error::RELEASE_NOTES.md is stale: no 'dopeIPTV ${VER}' heading. Update it before tagging."
            exit 1
          fi
          echo "Tag, version and release notes all agree on ${VER}."
      - name: Bake built-in OpenSubtitles key
        shell: bash
        env:
          DOPEIPTV_OPENSUBTITLES_KEY: ${{ secrets.DOPEIPTV_OPENSUBTITLES_KEY }}
        run: |
          printf 'OPENSUBTITLES_API_KEY = "%s"\n' "${DOPEIPTV_OPENSUBTITLES_KEY}" > dopeiptv/_opensubtitles_key.py
          if [ -z "${DOPEIPTV_OPENSUBTITLES_KEY}" ]; then
            echo "::warning::DOPEIPTV_OPENSUBTITLES_KEY secret is empty - subtitles from OpenSubtitles need a key in Settings in this build."
          fi
      - name: Bake built-in TMDB key
        env:
          DOPEIPTV_TMDB_KEY: ${{ secrets.DOPEIPTV_TMDB_KEY }}
        run: |
          printf 'TMDB_API_KEY = "%s"\n' "${DOPEIPTV_TMDB_KEY}" > dopeiptv/_tmdb_key.py
          if [ -n "${DOPEIPTV_TMDB_KEY}" ]; then
            echo "Built-in TMDB key baked in (${#DOPEIPTV_TMDB_KEY} chars)."
          else
            echo "::warning::DOPEIPTV_TMDB_KEY secret is empty - the built-in TMDB option will NOT appear in this build."
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: System deps (libmpv, ffmpeg, Qt runtime, fpm, appimagetool)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mpv libmpv-dev ffmpeg ruby ruby-dev build-essential \
            libgl1 libegl1 libxcb-cursor0 libpulse0 desktop-file-utils \
            libfuse2 appstream
          # Everything Qt's X11 platform plugin links, so PyInstaller finds
          # and bundles it. A library missing here is silently left out, and
          # the AppImage then dies at start on any X11 box that lacks it too
          # (AppImageHub's test runner was the first to say so).
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-xkb1 \
            libxcb-image0 libxcb-render-util0 libxcb-shape0 libxcb-util1
          sudo gem install --no-document fpm
          # Retried, because one flaky transfer used to fail the whole Linux
          # build - the primary platform - on a download that works if you
          # ask twice. The Windows job's fetches have had this since they
          # were written; these two never did.
          fetch() {
            # A 5xx from GitHub's release downloads is retried too, for
            # up to about two minutes: the 504s of 8 Nov 2026 came and went.
            wget -q --tries=8 --timeout=30 --waitretry=15 \
              --retry-connrefused --retry-on-http-error=429,500,502,503,504 \
              -O "$1" "$2"
          }
          fetch /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage
          chmod +x /usr/local/bin/appimagetool
          # Statically-linked AppImage runtime. The default runtime needs the
          # host to have libfuse2 installed - which newer Ubuntu drops, so the
          # AppImage refuses to start with a cryptic FUSE error until the user
          # runs "apt install libfuse2". This static runtime carries its own
          # FUSE, so the AppImage "just runs" on a stock system.
          fetch /usr/local/bin/appimage-runtime \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${{ matrix.arch }}
          # A truncated download is worse than a failed one: appimagetool
          # would run and produce an AppImage nobody can start.
          test -s /usr/local/bin/appimagetool
          test -s /usr/local/bin/appimage-runtime
      - name: Python build deps
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt
      - name: PyInstaller bundle
        run: pyinstaller --noconfirm dopeiptv.spec   # -> dist/dopeiptv/
      - name: Audit host Wayland libraries
        run: |
          found=$(find dist/dopeiptv -name 'libwayland-*.so*' -print)
          if [ -n "$found" ]; then
            echo "::error::Bundled Wayland libraries can shadow the host Mesa dependencies"
            printf '%s\n' "$found"
            exit 1
          fi
      - name: Audit host font and GBM libraries
        run: |
          # The host's own: an older copy in the bundle reads a newer distro's
          # fontconfig configuration with errors, or cannot drive its Mesa.
          found=$(find dist/dopeiptv \( -name 'libfontconfig.so*' \
            -o -name 'libfreetype.so*' -o -name 'libharfbuzz.so*' \
            -o -name 'libexpat.so*' -o -name 'libgbm.so*' \) -print)
          if [ -n "$found" ]; then
            echo "::error::Bundled font or GBM libraries shadow the host's"
            printf '%s\n' "$found"
            exit 1
          fi
      - name: Render icons
        run: QT_QPA_PLATFORM=offscreen python packaging/gen_icon.py build/icons
      - name: Version
        id: v
        run: echo "version=$(python -c 'import dopeiptv,sys;print(dopeiptv.VERSION)')" >> "$GITHUB_OUTPUT"
      - name: Build AppImage
        run: |
          V=${{ steps.v.outputs.version }}
          mkdir -p AppDir/usr
          cp -r dist/dopeiptv AppDir/usr/dopeiptv
          # The root copy is what appimagetool turns into .DirIcon, which is
          # the icon a file manager shows for the .AppImage file itself.
          cp build/icons/dopeiptv.png AppDir/dopeiptv.png
          # And the icon theme copy, which is where a desktop-integration tool
          # (appimaged, AppImageLauncher) reads the icon from when it installs
          # a menu entry. Only .DirIcon was here, so integration had a single
          # 256 px image to work with and nothing at all at the smaller sizes
          # a panel or a menu actually asks for.
          for s in 256 128 64 48 32; do
            d="AppDir/usr/share/icons/hicolor/${s}x${s}/apps"
            mkdir -p "$d"
            cp "build/icons/${s}x${s}/io.github.slimture.dopeIPTV.png" \
               "$d/dopeiptv.png"
          done
          mkdir -p AppDir/usr/share/applications
          sed 's/^Icon=.*/Icon=dopeiptv/' dopeiptv.desktop > AppDir/dopeiptv.desktop
          cp AppDir/dopeiptv.desktop AppDir/usr/share/applications/dopeiptv.desktop
          # AppStream metadata: the description, links and screenshots a
          # software catalog (AppImageHub, GNOME Software) shows. The same file
          # as the Flatpak's, launching this package's own desktop file.
          mkdir -p AppDir/usr/share/metainfo
          sed 's#<launchable type="desktop-id">.*</launchable>#<launchable type="desktop-id">dopeiptv.desktop</launchable>#' \
            packaging/io.github.slimture.dopeIPTV.metainfo.xml \
            > AppDir/usr/share/metainfo/io.github.slimture.dopeIPTV.metainfo.xml
          grep -q '<launchable type="desktop-id">dopeiptv.desktop</launchable>' \
            AppDir/usr/share/metainfo/io.github.slimture.dopeIPTV.metainfo.xml
          appstreamcli validate --no-net \
            AppDir/usr/share/metainfo/io.github.slimture.dopeIPTV.metainfo.xml
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/dopeiptv/dopeiptv" "$@"
          EOF
          chmod +x AppDir/AppRun
          ARCH=${{ matrix.arch }} appimagetool --no-appstream \
            --runtime-file /usr/local/bin/appimage-runtime \
            AppDir "dopeIPTV-${V}-${{ matrix.arch }}.AppImage"
      - name: Build .deb
        run: |
          V=${{ steps.v.outputs.version }}
          root=pkgroot
          mkdir -p "$root/opt/dopeiptv" "$root/usr/bin" \
                   "$root/usr/share/applications"
          cp -r dist/dopeiptv/* "$root/opt/dopeiptv/"
          cat > "$root/usr/bin/dopeiptv" <<'EOF'
          #!/bin/sh
          exec /opt/dopeiptv/dopeiptv "$@"
          EOF
          chmod +x "$root/usr/bin/dopeiptv"
          install -m644 dopeiptv.desktop "$root/usr/share/applications/dopeiptv.desktop"
          install -Dm644 AppDir/usr/share/metainfo/io.github.slimture.dopeIPTV.metainfo.xml \
            "$root/usr/share/metainfo/io.github.slimture.dopeIPTV.metainfo.xml"
          # Every rendered size, not just 256: a panel asking for 32 px was
          # downscaling the big one, which is why the icon looked soft in a
          # taskbar next to sharp system icons.
          for s in 256 128 64 48 32; do
            d="$root/usr/share/icons/hicolor/${s}x${s}/apps"
            mkdir -p "$d"
            install -m644 "build/icons/${s}x${s}/io.github.slimture.dopeIPTV.png" \
              "$d/dopeiptv.png"
          done
          fpm -s dir -t deb -n dopeiptv -v "$V" \
            --license GPL-3.0-or-later \
            --description "Modern IPTV player for Xtream Codes with EPG" \
            --url https://dopeiptv.org/ \
            --depends libgl1 --depends libegl1 --depends libxcb-cursor0 \
            --depends libpulse0 \
            --depends libwayland-client0 --depends libwayland-cursor0 \
            --depends libwayland-egl1 --depends libwayland-server0 \
            --depends libfontconfig1 --depends libfreetype6 \
            --depends libharfbuzz0b --depends libexpat1 --depends libgbm1 \
            -C "$root" .
      - name: Self-containment test across clean distros
        run: |
          # Prove the embedded player works on a real user's machine - not
          # just where ffmpeg/libmpv happen to be installed - by running the
          # AppImage's GUI-less --self-check inside SEVERAL pristine distro
          # containers with no media stack installed. Each distro ships a
          # different ffmpeg soname, so if libmpv's deps weren't fully bundled
          # this fails - exactly the "only works where mpv is installed" bug.
          # We install only the GUI/host base every desktop already has
          # (libGL/X/Wayland/audio); the ffmpeg/libass media stack must come
          # from our bundle, which is what this proves. --self-check needs no
          # GPU or display.
          set -e
          for img in ${{ matrix.test_distros }}; do
            echo "::group::self-containment on $img"
            docker run --rm -v "$PWD:/work:ro" "$img" bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                libgl1 libegl1 libglib2.0-0 libfontconfig1 libfreetype6 \
                libharfbuzz0b libexpat1 \
                libdbus-1-3 libxkbcommon0 libxcb-cursor0 libx11-6 libxext6 \
                libxrandr2 libxv1 libxss1 libwayland-client0 libwayland-cursor0 \
                libwayland-egl1 libwayland-server0 \
                libdrm2 libgbm1 libpulse0 >/dev/null
              # libasound has different package names across releases (t64
              # transition), so try both.
              apt-get install -y -qq --no-install-recommends libasound2t64 \
                >/dev/null 2>&1 \
                || apt-get install -y -qq --no-install-recommends libasound2 \
                >/dev/null
              # Extract into a throwaway dir INSIDE the (ephemeral) container,
              # not the shared /work mount, so distro runs do not collide.
              ap=$(ls /work/dopeIPTV-*.AppImage | head -1)
              cp "$ap" /tmp/app.AppImage
              chmod +x /tmp/app.AppImage
              cd /tmp
              ./app.AppImage --appimage-extract >/dev/null
              INT=/tmp/squashfs-root/usr/dopeiptv/_internal
              echo "--- libmpv unresolved deps (ldd) ---"
              if LD_LIBRARY_PATH="$INT" ldd "$INT/libmpv.so.2" 2>&1 \
                   | grep -i "not found"; then
                echo "::error::libmpv has unresolved deps on '"$img"'"
                exit 1
              fi
              echo "(none missing per ldd)"
              echo "--- self-check ---"
              /tmp/squashfs-root/usr/dopeiptv/dopeiptv --self-check
              # The X11 platform plugin must load from the bundle alone.
              echo "--- Qt X11 platform plugin unresolved deps (ldd) ---"
              if LD_LIBRARY_PATH="$INT:$INT/PyQt6/Qt6/lib" \
                   ldd "$INT/PyQt6/Qt6/plugins/platforms/libqxcb.so" \
                   | grep "not found"; then
                echo "::error::the Qt X11 platform plugin cannot load"
                exit 1
              fi
              # And the app must actually OPEN - with the distro own Mesa
              # driver, as a user machine has it. The self-check above loads
              # no GL at all, so it never saw either way a real start failed:
              # a missing X11 library, or a bundled libstdc++ older than the
              # one the host Mesa LLVM needs (Ubuntu 24.04+), which leaves X11
              # with no GL config and Qt aborts.
              echo "--- launch under Xvfb with the distro Mesa ---"
              apt-get install -y -qq --no-install-recommends xvfb xauth \
                libgl1-mesa-dri libglx-mesa0 >/dev/null
              export HOME=/tmp/home
              mkdir -p "$HOME"
              xvfb-run -a -s "-screen 0 1280x800x24" \
                /tmp/squashfs-root/AppRun >/tmp/launch.log 2>&1 &
              pid=$!
              sleep 15
              if ! kill -0 "$pid" 2>/dev/null; then
                cat /tmp/launch.log
                echo "::error::the app exited within 15 s instead of showing a window"
                exit 1
              fi
              if ! grep -q "Embedded playback: enabled" /tmp/launch.log; then
                cat /tmp/launch.log
                echo "::error::the app runs, but in-app video is off"
                exit 1
              fi
              echo "alive after 15 s, in-app video enabled"
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              # Debian 13 Mesa uses Wayland symbols absent from the 22.04
              # build host. A live process alone misses the no-window failure.
              if [ "'"$img"'" = "debian:13" ]; then
                apt-get install -y -qq --no-install-recommends \
                  weston python3 libegl-mesa0 >/dev/null
                python3 /work/tools/linux_wayland_smoke.py \
                  /tmp/squashfs-root/AppRun
              fi
            '
            echo "::endgroup::"
          done
      - name: Newest distro - Arch Linux starts without font or Mesa errors
        if: matrix.arch == 'x86_64'
        run: |
          # A rolling distro has the newest fontconfig and Mesa, which is where
          # an older library in the bundle shows first: 1.2.17 printed a page
          # of "Fontconfig error" and "did not find extension DRI_Mesa" on
          # Arch. Rolling also means a mirror or keyring can be down for a
          # day: that skips the check with a warning, only the app fails it.
          if ! docker pull -q archlinux:latest >/dev/null; then
            echo "::warning::archlinux image unavailable - Arch start check skipped"
            exit 0
          fi
          docker run --rm -v "$PWD:/work:ro" archlinux:latest bash -c '
            set -e
            sed -i "s/^#DisableSandbox/DisableSandbox/" /etc/pacman.conf
            ok=""
            for try in 1 2 3; do
              if pacman -Sy --noconfirm --needed archlinux-keyring \
                   >/tmp/pacman.log 2>&1 \
                 && pacman -Su --noconfirm --needed \
                   fontconfig freetype2 harfbuzz expat ttf-dejavu \
                   mesa libglvnd libx11 libxcb libxext libxrandr libxv libxss \
                   libxkbcommon wayland libpulse alsa-lib dbus \
                   xorg-server-xvfb >>/tmp/pacman.log 2>&1; then
                ok=1
                break
              fi
              sleep 15
            done
            if [ -z "$ok" ]; then
              tail -20 /tmp/pacman.log
              echo "::warning::Arch packages could not be installed - Arch start check skipped"
              exit 0
            fi
            ap=$(ls /work/dopeIPTV-*.AppImage | head -1)
            cp "$ap" /tmp/app.AppImage
            chmod +x /tmp/app.AppImage
            cd /tmp
            ./app.AppImage --appimage-extract >/dev/null
            export HOME=/tmp/home
            mkdir -p "$HOME"
            Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 &
            sleep 2
            DISPLAY=:99 /tmp/squashfs-root/AppRun >/tmp/launch.log 2>&1 &
            pid=$!
            sleep 15
            alive=1
            kill -0 "$pid" 2>/dev/null || alive=0
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            cat /tmp/launch.log
            if [ "$alive" != 1 ]; then
              echo "::error::the app exited within 15 s on Arch"
              exit 1
            fi
            if ! grep -q "Embedded playback: enabled" /tmp/launch.log; then
              echo "::error::the app runs on Arch, but in-app video is off"
              exit 1
            fi
            if grep -E "Fontconfig (error|warning)|DRI_Mesa|failed to bind extensions" \
                 /tmp/launch.log; then
              echo "::error::a bundled library clashes with the host libraries on Arch"
              exit 1
            fi
            echo "Arch: alive after 15 s, in-app video on, no font or Mesa errors"
          '
      - name: Smoke test - launch AppImage and .deb
        run: |
          # Headless CI has no hardware GL, so QOpenGLWidget's GL init step
          # frequently aborts even though a real user's launch is fine. We
          # still get the signal we care about: did Python/Qt actually load
          # (imports OK, no missing shared libs) BEFORE the GL init crash?
          # A crash with an ImportError / "cannot open shared object" is a
          # real packaging bug. A crash after our app's heartbeat log line
          # is "expected in headless CI, real users are fine".
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri mesa-utils
          export LIBGL_ALWAYS_SOFTWARE=1
          launch_and_check() {
            local exe="$1" name="$2"
            echo "::group::Smoke: $name"
            xvfb-run --auto-servernum --server-args='-screen 0 1024x768x24' \
              "$exe" >/tmp/$name.log 2>&1 &
            local pid=$!
            sleep 6
            # The app degrades gracefully when libmpv can't be loaded
            # (it just disables the embedded player and keeps running),
            # so a missing/mis-named bundled libmpv would otherwise sail
            # through as a PASS. "Failed to load dynlib" is PyInstaller's
            # error for a bundled shared library it can't find - treat it
            # as a hard packaging failure.
            if grep -qE "Failed to load dynlib" /tmp/$name.log; then
              echo "::error::$name: a bundled library failed to load (libmpv?) - the embedded player would be dead:"
              grep -iE "Failed to load dynlib|libmpv|Embedded playback disabled" /tmp/$name.log | head
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              echo "::endgroup::"
              return 1
            fi
            if kill -0 "$pid" 2>/dev/null; then
              echo "$name: process $pid alive after 6s - PASS"
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              echo "::endgroup::"
              return 0
            fi
            # Died early - classify.
            if grep -qE "ImportError|ModuleNotFoundError|cannot open shared object|No module named" /tmp/$name.log; then
              echo "::error::$name failed at Python / shared-library load:"
              tail -60 /tmp/$name.log
              echo "::endgroup::"
              return 1
            fi
            # Look for our own startup heartbeat to prove Python + Qt ran.
            if grep -qE "\[dopeIPTV\]|Qt platform:" /tmp/$name.log; then
              echo "$name: reached Python init before crashing (expected " \
                "under headless CI without a real GPU) - PASS"
              echo "--- log tail ---"
              tail -30 /tmp/$name.log
              echo "::endgroup::"
              return 0
            fi
            echo "::error::$name died with no useful log:"
            tail -60 /tmp/$name.log
            echo "::endgroup::"
            return 1
          }
          # Reproduce a real user's machine: NO system mpv/libmpv installed.
          # The build host has libmpv (we built against it), so python-mpv's
          # find_library('mpv') would locate the *system* copy and the bundled
          # one would never be exercised - which is exactly how shipping a
          # bundle that only works where mpv is already installed slipped
          # through. Remove it so the packaged libmpv is the only one.
          sudo apt-get remove -y mpv libmpv-dev libmpv2 libmpv1 || true
          sudo ldconfig
          # Authoritative libmpv check: run the bundle's built-in --self-check,
          # which loads the bundled libmpv WITHOUT creating a QApplication.
          # A full GUI launch aborts under headless CI (no GPU) long before
          # the app can report libmpv's status, so we verify it GUI-lessly.
          # Exit 0 = bundled libmpv loaded; exit 1 = embedded player dead
          # (exactly the "only works where mpv is preinstalled" bug).
          self_check() {
            local exe="$1" name="$2"
            echo "::group::Self-check (bundled libmpv): $name"
            if "$exe" --self-check >/tmp/$name-selfcheck.log 2>&1; then
              cat /tmp/$name-selfcheck.log
              echo "$name: embedded player enabled from bundled libmpv - PASS"
              echo "::endgroup::"
              return 0
            fi
            echo "::error::$name: embedded player NOT enabled from the bundled libmpv (would be dead on a machine without a system mpv):"
            cat /tmp/$name-selfcheck.log
            echo "::endgroup::"
            return 1
          }
          # AppImage: no install needed, just chmod+run.
          chmod +x dopeIPTV-*.AppImage
          APPIMAGE="$PWD/$(ls dopeIPTV-*.AppImage | head -1)"
          self_check "$APPIMAGE" appimage
          launch_and_check "$APPIMAGE" appimage
          # .deb: install then run via the /usr/bin/dopeiptv wrapper.
          sudo apt-get install -y ./dopeiptv_*.deb
          self_check "$(command -v dopeiptv)" deb
          launch_and_check "$(command -v dopeiptv)" deb
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.AppImage
            *.deb
          body_path: RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle-${{ matrix.arch }}
          path: |
            *.AppImage
            *.deb

  # -------------------------------------------------- macOS .app + .dmg ---
  # Apple Silicon (macos-15, arm64) with Homebrew's mpv, and Intel
  # (macos-15-intel, x86_64) with conda-forge's - see the matrix below.
  #
  # Nothing here sets a deployment target, so the minimum macOS a .dmg
  # supports follows the runner it was built on (Homebrew bottles are built
  # per OS version, so pinning the target alone would not buy compatibility
  # back). That floor is macOS 15.
  #
  # Signed with Solecraft AB's Developer ID and notarised by Apple, so the
  # .dmg opens like any app from the web - when the repository has the
  # secrets (docs/MAINTAINING.md, "macOS signing"): MACOS_CERT_P12 and
  # MACOS_CERT_PASSWORD for the certificate, APPLE_API_KEY_P8,
  # APPLE_API_KEY_ID and APPLE_API_ISSUER_ID for notarytool. Without them -
  # a fork - the .app is signed ad hoc as before and users allow the first
  # launch under Privacy & Security -> Open Anyway.
  macos-dmg:
    name: macOS .dmg (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 entered deprecation on 2026-07-06: brownouts from
          # 2026-10-05, gone entirely on 2026-11-02. Moved before it could
          # do what macos-13 did to 1.2.8 - fail quietly and drop a .dmg
          # from the release without anyone noticing.
          - runner: macos-15
            arch: arm64
            deps: brew
            experimental: false
          #
          # Intel, back with conda-forge. Homebrew moved macOS x86_64 to
          # Tier 3 in September 2026 - no CI, no new bottles: "brew install
          # mpv" answers "no bottle available", which is why 1.2.11 dropped
          # this .dmg. conda-forge still builds osx-64 packages: ffmpeg and
          # every library libmpv needs come from there, into an environment
          # of its own (never on PATH - it has a Python of its own, which
          # would shadow setup-python's); libmpv itself is built from mpv's
          # source against them (conda-forge's own is broken for
          # embedding), and the spec bundles libmpv and ffmpeg from there. macos-15-intel is there until Aug
          # 2027; Apple has said Tahoe 26 is the last macOS for Intel.
          - runner: macos-15-intel
            arch: x86_64
            deps: conda
            experimental: true
    #
    # Only the Intel leg may fail without failing the run. A blanket
    # continue-on-error once let a broken arm64 build go green and ship a
    # release with no macOS download at all (1.2.8), so arm64 is never
    # experimental.
    # A test build publishes what was built, whatever the leg.
    continue-on-error: ${{ matrix.experimental || (inputs.nightly_version || '') != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Nightly version
        if: ${{ inputs.nightly_version }}
        shell: bash
        env:
          V: ${{ inputs.nightly_version }}
        run: |
          # A test build is named and versioned after its build: the app,
          # the wheel and every package say 1.4.0.123, not 1.4.0.
          sed -i.bak -E "s/^__version__ = \"[^\"]*\"/__version__ = \"${V}\"/" dopeiptv/__init__.py
          sed -i.bak -E "s/^version = \"[^\"]*\"/version = \"${V}\"/" pyproject.toml
          rm -f dopeiptv/*.bak ./*.bak
          grep -q "^__version__ = \"${V}\"" dopeiptv/__init__.py
          grep -q "^version = \"${V}\"" pyproject.toml
          echo "Nightly build ${V}"
      - name: Guard - release notes must match this version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # The release body comes from RELEASE_NOTES.md and the artifacts are
          # built from whatever the tag points at, so three things must agree
          # or the release is a lie: the tag, the package version, the notes.
          #
          # v1.1.0 shipped with 1.0.0's notes because nothing checked the file.
          # v1.2.3 then shipped 1.2.2's code AND notes, because the tag landed
          # on a commit made before the version bump - and this guard only
          # compared the notes against __version__, which agreed with itself
          # perfectly at 1.2.2. Check the TAG too.
          TAG=${GITHUB_REF#refs/tags/v}
          VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' dopeiptv/__init__.py)
          if [ "${TAG}" != "${VER}" ]; then
            echo "::error::Tag v${TAG} sits on a commit whose __version__ is ${VER} - wrong commit, or the bump was never committed."
            exit 1
          fi
          if ! grep -q "dopeIPTV ${VER}" RELEASE_NOTES.md; then
            echo "::error::RELEASE_NOTES.md is stale: no 'dopeIPTV ${VER}' heading. Update it before tagging."
            exit 1
          fi
          echo "Tag, version and release notes all agree on ${VER}."
      - name: Guard - a rebuild for a release changes no app code
        if: ${{ (inputs.replace_macos_dmg || '') != '' }}
        env:
          TAG: ${{ inputs.replace_macos_dmg }}
        run: |
          # The .dmg on a release must hold the app that release is: only the
          # build may differ from the tag, never dopeiptv/ or its requirements.
          git fetch --quiet --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if ! git diff --quiet "$TAG" HEAD -- dopeiptv requirements.txt; then
            echo "::error::the app has changed since ${TAG}: that is a new release, not a rebuild"
            git diff --stat "$TAG" HEAD -- dopeiptv requirements.txt
            exit 1
          fi
          echo "App code identical to ${TAG}."
      - name: Bake built-in OpenSubtitles key
        shell: bash
        env:
          DOPEIPTV_OPENSUBTITLES_KEY: ${{ secrets.DOPEIPTV_OPENSUBTITLES_KEY }}
        run: |
          printf 'OPENSUBTITLES_API_KEY = "%s"\n' "${DOPEIPTV_OPENSUBTITLES_KEY}" > dopeiptv/_opensubtitles_key.py
          if [ -z "${DOPEIPTV_OPENSUBTITLES_KEY}" ]; then
            echo "::warning::DOPEIPTV_OPENSUBTITLES_KEY secret is empty - subtitles from OpenSubtitles need a key in Settings in this build."
          fi
      - name: Bake built-in TMDB key
        env:
          DOPEIPTV_TMDB_KEY: ${{ secrets.DOPEIPTV_TMDB_KEY }}
        run: |
          printf 'TMDB_API_KEY = "%s"\n' "${DOPEIPTV_TMDB_KEY}" > dopeiptv/_tmdb_key.py
          if [ -n "${DOPEIPTV_TMDB_KEY}" ]; then
            echo "Built-in TMDB key baked in (${#DOPEIPTV_TMDB_KEY} chars)."
          else
            echo "::warning::DOPEIPTV_TMDB_KEY secret is empty - the built-in TMDB option will NOT appear in this build."
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: System deps (mpv, ffmpeg, create-dmg)
        if: matrix.deps == 'brew'
        run: |
          brew update
          brew install mpv create-dmg
          # A plain ffmpeg. There used to be a build from source here for
          # libass, because a text subtitle had to be drawn into the picture
          # and only libass could do it. That is gone: a text subtitle now
          # travels to the receiver as a WebVTT rendition beside the picture,
          # which any ffmpeg writes, and a picture-based one is drawn with
          # overlay, which every build has. The check that followed went with
          # it - there is nothing left for it to guarantee.
          brew install ffmpeg
      - name: System deps from conda-forge, libmpv built here (Intel)
        if: matrix.deps == 'conda'
        run: |
          # micromamba alone, into the runner's temp dir: an environment with
          # conda-forge's mpv - for the libraries libmpv needs, at versions
          # that build it - and ffmpeg, meson, ninja and pkg-config. Not
          # activated and not on PATH: the spec is told where things are.
          MM="${RUNNER_TEMP}/mm"
          mkdir -p "$MM"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            https://micro.mamba.pm/api/micromamba/osx-64/latest \
            | tar -xj -C "$MM" bin/micromamba
          ENVDIR="${RUNNER_TEMP}/mpvenv"
          MAMBA_ROOT_PREFIX="$MM/root" "$MM/bin/micromamba" create -y \
            -p "$ENVDIR" -c conda-forge --override-channels \
            mpv ffmpeg meson ninja pkg-config
          # conda-forge's own libmpv cannot be used: it leaves
          # cfstr_from_cstr and cfstr_get_cstr (mpv's macOS helpers) to a
          # flat-namespace lookup that only the mpv program answers, so
          # dlopen fails. libmpv is built here from the same mpv version,
          # against the environment's libraries, and replaces it. Without
          # Swift and Cocoa: the app draws through libmpv's render API and
          # needs neither (CoreAudio and the rest stay), mpv's Cocoa parts
          # (the clipboard among them) want the Swift build's header, and
          # Swift cannot build Apple's modules with the environment's
          # headers on its include path ("could not build module Darwin").
          MPV_VER=$(ls "$ENVDIR"/conda-meta/ | sed -nE 's/^mpv-([0-9][0-9.]*)-.*\.json$/\1/p' | head -1)
          echo "mpv ${MPV_VER}"
          git clone --quiet --depth 1 --branch "v${MPV_VER}" \
            https://github.com/mpv-player/mpv.git "${RUNNER_TEMP}/mpv-src"
          cd "${RUNNER_TEMP}/mpv-src"
          # mpv's own bug, and why conda-forge's libmpv is broken too: the
          # CoreAudio outputs use cfstr_from_cstr/cfstr_get_cstr from
          # osdep/utils-mac.c, but meson.build compiles that file only with
          # Cocoa. Built without Cocoa (see below), it is added beside them.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("meson.build")
          s = p.read_text()
          anchor = ("    sources += files('audio/out/ao_coreaudio_chmap.c',\n"
                    "                     'audio/out/ao_coreaudio_utils.c')\n")
          if "osdep/utils-mac.c')\n    endif" not in s:
              assert anchor in s, "mpv's meson.build changed: see this step"
              s = s.replace(anchor, anchor + "    if not features['cocoa']\n"
                            "        sources += files('osdep/utils-mac.c')\n"
                            "    endif\n", 1)
              p.write_text(s)
          PY
          export PKG_CONFIG_PATH="$ENVDIR/lib/pkgconfig"
          export MACOSX_DEPLOYMENT_TARGET=11.0
          "$ENVDIR/bin/meson" setup build --prefix="$ENVDIR" --libdir=lib \
            --buildtype=release -Dlibmpv=true -Dcplayer=false -Dtests=false \
            -Dswift-build=disabled -Dcocoa=disabled \
            -Dlua=disabled -Djavascript=disabled \
            -Dmanpage-build=disabled -Dhtml-build=disabled \
            -Dpdf-build=disabled -Dc_link_args=-Wl,-rpath,@loader_path
          "$ENVDIR/bin/meson" compile -C build
          rm -f "$ENVDIR"/lib/libmpv*.dylib
          "$ENVDIR/bin/meson" install -C build --quiet
          test -f "$ENVDIR/lib/libmpv.2.dylib"
          # Every symbol libmpv needs from outside must have a library to
          # come from: no flat-namespace lookups of mpv's own functions.
          if nm -u "$ENVDIR/lib/libmpv.2.dylib" | grep -E '_cfstr_(from|get)_cstr'; then
            echo "::error::the built libmpv still leaves mpv's own helpers unresolved"
            exit 1
          fi
          test -x "$ENVDIR/bin/ffmpeg"
          "$ENVDIR/bin/ffmpeg" -hide_banner -version | head -1
          echo "DOPEIPTV_LIBMPV_DIR=$ENVDIR/lib" >> "$GITHUB_ENV"
          echo "DOPEIPTV_FFMPEG=$ENVDIR/bin/ffmpeg" >> "$GITHUB_ENV"
          # create-dmg is a shell script: a formula with nothing to bottle.
          brew install create-dmg
      - name: Python build deps
        run: |
          python -m pip install --upgrade pip pyinstaller pyobjc-core
          python -m pip install -r requirements.txt
      - name: Version
        id: v
        run: echo "version=$(python -c 'import dopeiptv,sys;print(dopeiptv.VERSION)')" >> "$GITHUB_OUTPUT"
      - name: Build .icns
        run: |
          QT_QPA_PLATFORM=offscreen python packaging/gen_iconset.py build
          iconutil -c icns build/dopeiptv.iconset -o build/dopeiptv.icns
      - name: PyInstaller bundle (.app)
        env:
          DOPEIPTV_VERSION: ${{ steps.v.outputs.version }}
          DOPEIPTV_ICNS: ${{ github.workspace }}/build/dopeiptv.icns
        run: pyinstaller --noconfirm dopeiptv-mac.spec   # -> dist/dopeIPTV.app
      - name: Make libmpv and ffmpeg self-contained (Intel)
        if: matrix.deps == 'conda'
        # conda-forge's libraries find each other through @rpath; this copies
        # in what the bundle lacks and points every reference inside it.
        run: python packaging/macos_bundle_dylibs.py dist/dopeIPTV.app "$DOPEIPTV_LIBMPV_DIR"
      - name: Developer ID keychain
        id: sign
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # The certificate goes into a keychain of this run's own, never the
          # runner's login keychain, and is deleted at the end of the job.
          if [ -z "${MACOS_CERT_P12}" ] || [ -z "${MACOS_CERT_PASSWORD}" ]; then
            echo "::notice::No Developer ID secrets: an ad-hoc signed .dmg, not notarised."
            echo "identity=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KC="${RUNNER_TEMP}/signing.keychain-db"
          KCPW=$(openssl rand -hex 24)
          printf '%s' "${MACOS_CERT_P12}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "${RUNNER_TEMP}/cert.p12" -k "$KC" -P "${MACOS_CERT_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "${RUNNER_TEMP}/cert.p12"
          # Apple's intermediate for Developer ID, so the chain is whole here
          # whatever the runner image carries.
          curl -fsSL --retry 5 --retry-delay 5 -o "${RUNNER_TEMP}/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "${RUNNER_TEMP}/DeveloperIDG2CA.cer" -k "$KC" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" \
            | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -1)
          if [ -z "$ID" ]; then
            echo "::error::MACOS_CERT_P12 holds no valid Developer ID Application identity"
            security find-identity -p codesigning "$KC" || true
            exit 1
          fi
          echo "Signing as: $ID"
          echo "identity=$ID" >> "$GITHUB_OUTPUT"
          echo "keychain=$KC" >> "$GITHUB_OUTPUT"
      - name: Sign the .app
        env:
          ID: ${{ steps.sign.outputs.identity }}
          KC: ${{ steps.sign.outputs.keychain }}
        run: |
          # We bundle/stage extra dylibs (libmpv, ffmpeg) after PyInstaller's
          # own signing, which invalidates the bundle signature - on Apple
          # Silicon an app with a broken/missing signature is killed on launch
          # ("bounces once and dies") with no Gatekeeper prompt. So the whole
          # bundle is signed again here, inside out: every Mach-O file, deepest
          # first, then the frameworks around them, then the app.
          APP="dist/dopeIPTV.app"
          if [ -z "$ID" ]; then
            # No Developer ID: ad hoc (identity "-"). Not notarisable, but a
            # valid signature, so a downloaded app gets the normal prompt and
            # can be allowed under Privacy & Security -> Open Anyway.
            find "$APP/Contents" \( -name '*.dylib' -o -name '*.so' \) -print0 \
              | xargs -0 -I{} codesign --force --timestamp=none --sign - {} || true
            codesign --force --deep --timestamp=none --sign - "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP" \
              && echo "ad-hoc signature valid" \
              || echo "::warning::ad-hoc signature verification reported issues"
            exit 0
          fi
          ENT="packaging/macos-entitlements.plist"
          # Developer ID, hardened runtime and a secure timestamp: what
          # notarisation asks of every piece of code. Apple's timestamp
          # server now and then does not answer, so each signature gets
          # three tries.
          sign() {
            for try in 1 2 3; do
              if codesign --force --timestamp --options runtime --keychain "$KC" \
                   --sign "$ID" "$@"; then
                return 0
              fi
              echo "codesign failed (try $try): $*"
              sleep 5
            done
            echo "::error::could not sign $*"
            return 1
          }
          depth_first() { awk -F/ '{print NF "\t" $0}' | sort -rn | cut -f2-; }
          find "$APP/Contents" -type f | while IFS= read -r f; do
            case "$(file -b "$f")" in Mach-O*) echo "$f";; esac
          done | depth_first > "${RUNNER_TEMP}/macho.txt"
          echo "$(wc -l < "${RUNNER_TEMP}/macho.txt") Mach-O files to sign"
          while IFS= read -r f; do
            if file -b "$f" | grep -q 'executable'; then
              sign --entitlements "$ENT" "$f"
            else
              sign "$f"
            fi
          done < "${RUNNER_TEMP}/macho.txt"
          find "$APP/Contents" -type d \( -name '*.framework' -o -name '*.app' \) \
            | depth_first | while IFS= read -r b; do sign "$b"; done
          sign --entitlements "$ENT" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime|Timestamp)' || true
      - name: Pack .dmg
        run: |
          V=${{ steps.v.outputs.version }}
          # Use create-dmg for the pretty side-by-side install window (app
          # icon on the left, /Applications alias on the right). --skip-jenkins
          # avoids CI-specific quirks; --no-internet-enable stops macOS from
          # tagging the DMG as internet-quarantined at mount time.
          create-dmg \
            --volname "dopeIPTV ${V}" \
            --window-pos 200 120 \
            --window-size 600 380 \
            --icon-size 100 \
            --icon "dopeIPTV.app" 150 190 \
            --app-drop-link 450 190 \
            --hide-extension "dopeIPTV.app" \
            --no-internet-enable \
            --skip-jenkins \
            "dopeIPTV-${V}-macOS-${{ matrix.arch }}.dmg" \
            "dist/dopeIPTV.app"
      - name: Sign and notarise the .dmg
        if: steps.sign.outputs.identity != ''
        env:
          ID: ${{ steps.sign.outputs.identity }}
          KC: ${{ steps.sign.outputs.keychain }}
          NIGHTLY: ${{ inputs.nightly_version }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # Apple checks the .dmg and the app in it, and the ticket it issues
          # is stapled to the .dmg, so the first open needs no lookup. The app
          # copied out of it is known to Gatekeeper by the same ticket.
          # Apple usually answers in minutes, but a new account's first
          # submissions and busy days take longer: wait up to two hours.
          V=${{ steps.v.outputs.version }}
          DMG="dopeIPTV-${V}-macOS-${{ matrix.arch }}.dmg"
          codesign --force --timestamp --keychain "$KC" --sign "$ID" "$DMG"
          # Only a release goes to Apple. A test build per push to testing
          # sent two more each time - six queued behind a new account's
          # first, slow review - and each waited two hours for nothing.
          # Signed, a test build opens after Open Anyway like before.
          if [ -n "${NIGHTLY}" ]; then
            echo "::notice::Test build: signed with the Developer ID, not sent to Apple (only releases are notarised)."
            exit 0
          fi
          if [ -z "${APPLE_API_KEY_P8}" ] || [ -z "${APPLE_API_KEY_ID}" ] || [ -z "${APPLE_API_ISSUER_ID}" ]; then
            echo "::error::Signed, but the App Store Connect API key secrets are missing: not notarised."
            exit 1
          fi
          KEY="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s' "${APPLE_API_KEY_P8}" | base64 --decode > "$KEY"
          AUTH=(--key "$KEY" --key-id "${APPLE_API_KEY_ID}" --issuer "${APPLE_API_ISSUER_ID}")
          xcrun notarytool submit "$DMG" "${AUTH[@]}" --wait --timeout 2h \
            --output-format json > "${RUNNER_TEMP}/notary.json" || true
          cat "${RUNNER_TEMP}/notary.json"; echo
          STATUS=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "${RUNNER_TEMP}/notary.json" 2>/dev/null || true)
          SUB=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' "${RUNNER_TEMP}/notary.json" 2>/dev/null || true)
          if [ "$STATUS" != "Accepted" ]; then
            # Apple's log names each file it refused and why.
            if [ -n "$SUB" ]; then xcrun notarytool log "$SUB" "${AUTH[@]}" || true; fi
            rm -f "$KEY"
            echo "::error::Apple did not notarise the .dmg (status: ${STATUS:-no answer})"
            exit 1
          fi
          rm -f "$KEY"
          for try in 1 2 3; do
            xcrun stapler staple "$DMG" && break
            echo "stapler failed (try $try)"; sleep 15
          done
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
      - name: Smoke test - mount .dmg and inspect the bundle
        run: |
          # Full GUI launch isn't feasible on a headless macOS runner (Cocoa
          # needs a real window server), so we verify the .app STRUCTURE
          # instead: Info.plist keys, the main binary, libmpv and its rpath,
          # icon file, and that hdiutil can actually mount the .dmg.
          V=${{ steps.v.outputs.version }}
          DMG="dopeIPTV-${V}-macOS-${{ matrix.arch }}.dmg"
          # Intel: put the conda environment out of reach first, so a library
          # the bundle still looks for there fails here and not on a Mac.
          if [ -n "${DOPEIPTV_LIBMPV_DIR:-}" ]; then
            mv "${RUNNER_TEMP}/mpvenv" "${RUNNER_TEMP}/mpvenv.hidden"
          fi
          echo "::group::Mount and inspect $DMG"
          MOUNT=$(hdiutil attach -readonly -mountrandom /tmp "$DMG" | tail -1 | awk '{print $NF}')
          APP="$MOUNT/dopeIPTV.app"
          test -d "$APP" || { echo "::error::.app missing inside mounted .dmg"; hdiutil detach "$MOUNT" || true; exit 1; }
          BIN="$APP/Contents/MacOS/dopeiptv"
          PLIST="$APP/Contents/Info.plist"
          test -x "$BIN" || { echo "::error::binary missing or not executable: $BIN"; hdiutil detach "$MOUNT" || true; exit 1; }
          test -f "$PLIST" || { echo "::error::Info.plist missing"; hdiutil detach "$MOUNT" || true; exit 1; }
          NAME=$(defaults read "${APP}/Contents/Info" CFBundleName)
          VER=$(defaults read "${APP}/Contents/Info" CFBundleShortVersionString)
          echo "CFBundleName=$NAME  CFBundleShortVersionString=$VER"
          test "$NAME" = "dopeIPTV" || { echo "::error::wrong CFBundleName ($NAME)"; hdiutil detach "$MOUNT" || true; exit 1; }
          # Signed with the Developer ID: Gatekeeper must take a release's
          # app as notarised, exactly as a Mac that downloaded it will. A
          # test build is not notarised; its signature must still hold.
          if [ -n "${{ steps.sign.outputs.identity }}" ] && [ -z "${{ inputs.nightly_version }}" ]; then
            GK=$(spctl --assess --type execute --verbose=2 "$APP" 2>&1 || true)
            echo "$GK"
            case "$GK" in
              *"Notarized Developer ID"*) echo "Gatekeeper: notarised - PASS" ;;
              *) echo "::error::Gatekeeper does not accept the app in the .dmg as notarised"
                 hdiutil detach "$MOUNT" || true; exit 1 ;;
            esac
          elif [ -n "${{ steps.sign.outputs.identity }}" ]; then
            codesign --verify --deep --strict --verbose=2 "$APP" || {
              echo "::error::the test build's Developer ID signature does not hold"
              hdiutil detach "$MOUNT" || true; exit 1; }
          fi
          # libmpv must be bundled under the exact soname python-mpv loads,
          # or the embedded player is dead on the user's Mac.
          MPV=$(find "$APP/Contents" -name 'libmpv.2.dylib' -print | head -1)
          if [ -z "$MPV" ]; then
            echo "::error::libmpv.2.dylib is not bundled in the .app - embedded player would be dead"
            find "$APP/Contents" -name 'libmpv*' -print
            hdiutil detach "$MOUNT" || true; exit 1
          fi
          echo "bundled libmpv: $MPV"
          # And its own dependencies must be bundled too, not left pointing
          # at Homebrew/Cellar paths that won't exist on a clean Mac.
          if otool -L "$MPV" | grep -E '/opt/homebrew|/usr/local/(lib|Cellar)|/opt/local|mpvenv'; then
            echo "::error::bundled libmpv still links against Homebrew paths - its deps aren't bundled; embedded player will fail on a machine without Homebrew"
            hdiutil detach "$MOUNT" || true; exit 1
          fi
          otool -L "$BIN" | head -20 || true
          # Check the icon actually made it in.
          test -f "$APP/Contents/Resources/dopeiptv.icns" \
            && echo "icon: present" \
            || echo "::warning::icon missing (Info.plist references it but file not found)"
          # All locale files must be inside the bundle (a slip here shipped a
          # 1.0.0 .dmg whose language picker was English-only).
          NLOC=$(find "$APP/Contents" -path '*dopeiptv/locale/*.json' | wc -l | tr -d ' ')
          echo "bundled locale files: $NLOC"
          if [ "$NLOC" -lt 26 ]; then
            echo "::error::only $NLOC locale JSONs inside the .app (expected 26) - the language picker would be English-only"
            hdiutil detach "$MOUNT" || true; exit 1
          fi
          # And they must actually LOAD from the frozen bundle: --self-check
          # runs GUI-less (no window server needed) and verifies both the
          # bundled libmpv and that every shipped language registers.
          echo "::group::--self-check (bundled libmpv + languages)"
          if ! "$BIN" --self-check; then
            echo "::error::--self-check failed on the mounted .app (libmpv or languages)"
            # Why libmpv does not load: dlopen's own message names the
            # library it could not find.
            echo "::group::libmpv: links, rpaths and dlopen"
            otool -L "$MPV" || true
            otool -l "$MPV" | grep -A2 LC_RPATH || true
            ls "$(dirname "$MPV")" | head -200 || true
            python3 -c 'import ctypes, sys; ctypes.CDLL(sys.argv[1])' "$MPV" 2>&1 | tail -5 || true
            echo "::endgroup::"
            hdiutil detach "$MOUNT" || true; exit 1
          fi
          echo "::endgroup::"
          hdiutil detach "$MOUNT"
          echo "::endgroup::"
          # As a final sanity check try to launch the .app briefly. On a
          # headless runner Cocoa may fail to fully init but a segfault-on-
          # startup would still surface within a couple of seconds.
          echo "::group::Try launching the .app"
          open --wait-apps --new "dist/dopeIPTV.app" &
          OPEN_PID=$!
          sleep 6
          if pgrep -x dopeiptv >/dev/null; then
            echo "dopeiptv is running - PASS"
            pkill -x dopeiptv 2>/dev/null || true
          else
            echo "::warning::dopeiptv didn't appear in pgrep - Cocoa may need a window server"
          fi
          kill "$OPEN_PID" 2>/dev/null || true
          echo "::endgroup::"
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.dmg'
          body_path: RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: '*.dmg'
      - name: Replace the .dmg on the published release
        if: ${{ (inputs.replace_macos_dmg || '') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.replace_macos_dmg }}
        run: |
          V=${{ steps.v.outputs.version }}
          if [ "$TAG" != "v${V}" ]; then
            echo "::error::this build is ${V}, not ${TAG#v}: nothing replaced"
            exit 1
          fi
          if [ -z "${{ steps.sign.outputs.identity }}" ]; then
            echo "::error::not signed with the Developer ID: nothing replaced"
            exit 1
          fi
          gh release upload "$TAG" "dopeIPTV-${V}-macOS-${{ matrix.arch }}.dmg" \
            --clobber --repo "${{ github.repository }}"
          echo "Replaced dopeIPTV-${V}-macOS-${{ matrix.arch }}.dmg on ${TAG}."
      - name: Remove the signing keychain
        if: always() && steps.sign.outputs.keychain != ''
        run: security delete-keychain "${{ steps.sign.outputs.keychain }}" || true

  # --------------------------------------------------------------- Windows ---
  # Produces a portable zip (unzip -> run dopeiptv.exe). A failure now marks the
  # release run red (no more silently shipping without the Windows zip, as
  # v1.2.0 did); the Linux/macOS jobs run independently and still attach their
  # own assets, so a Windows hiccup never removes those.
  windows-zip:
    name: Windows (${{ matrix.arch }})
    if: ${{ (inputs.replace_macos_dmg || '') == '' }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ (inputs.nightly_version || '') != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            mpv_arch: x86_64
            cmake_arch: x64
          # Native Windows-on-ARM (Snapdragon laptops). The x64 zip runs there
          # under Prism emulation, but native means real battery life - and the
          # whole supply chain exists now: PyQt6 ships win_arm64 wheels since
          # 6.9.1 and zhongfly/mpv-winbuild publishes mpv-dev-aarch64.
          - runner: windows-11-arm
            arch: arm64
            mpv_arch: aarch64
            cmake_arch: ARM64
    steps:
      - uses: actions/checkout@v5
      - name: Nightly version
        if: ${{ inputs.nightly_version }}
        shell: bash
        env:
          V: ${{ inputs.nightly_version }}
        run: |
          # A test build is named and versioned after its build: the app,
          # the wheel and every package say 1.4.0.123, not 1.4.0.
          sed -i.bak -E "s/^__version__ = \"[^\"]*\"/__version__ = \"${V}\"/" dopeiptv/__init__.py
          sed -i.bak -E "s/^version = \"[^\"]*\"/version = \"${V}\"/" pyproject.toml
          rm -f dopeiptv/*.bak ./*.bak
          grep -q "^__version__ = \"${V}\"" dopeiptv/__init__.py
          grep -q "^version = \"${V}\"" pyproject.toml
          echo "Nightly build ${V}"
      - name: Guard - release notes must match this version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # The release body comes from RELEASE_NOTES.md and the artifacts are
          # built from whatever the tag points at, so three things must agree
          # or the release is a lie: the tag, the package version, the notes.
          #
          # v1.1.0 shipped with 1.0.0's notes because nothing checked the file.
          # v1.2.3 then shipped 1.2.2's code AND notes, because the tag landed
          # on a commit made before the version bump - and this guard only
          # compared the notes against __version__, which agreed with itself
          # perfectly at 1.2.2. Check the TAG too.
          TAG=${GITHUB_REF#refs/tags/v}
          VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' dopeiptv/__init__.py)
          if [ "${TAG}" != "${VER}" ]; then
            echo "::error::Tag v${TAG} sits on a commit whose __version__ is ${VER} - wrong commit, or the bump was never committed."
            exit 1
          fi
          if ! grep -q "dopeIPTV ${VER}" RELEASE_NOTES.md; then
            echo "::error::RELEASE_NOTES.md is stale: no 'dopeIPTV ${VER}' heading. Update it before tagging."
            exit 1
          fi
          echo "Tag, version and release notes all agree on ${VER}."
      - name: Bake built-in OpenSubtitles key
        shell: bash
        env:
          DOPEIPTV_OPENSUBTITLES_KEY: ${{ secrets.DOPEIPTV_OPENSUBTITLES_KEY }}
        run: |
          printf 'OPENSUBTITLES_API_KEY = "%s"\n' "${DOPEIPTV_OPENSUBTITLES_KEY}" > dopeiptv/_opensubtitles_key.py
          if [ -z "${DOPEIPTV_OPENSUBTITLES_KEY}" ]; then
            echo "::warning::DOPEIPTV_OPENSUBTITLES_KEY secret is empty - subtitles from OpenSubtitles need a key in Settings in this build."
          fi
      - name: Bake built-in TMDB key
        shell: bash
        env:
          DOPEIPTV_TMDB_KEY: ${{ secrets.DOPEIPTV_TMDB_KEY }}
        run: |
          printf 'TMDB_API_KEY = "%s"\n' "${DOPEIPTV_TMDB_KEY}" > dopeiptv/_tmdb_key.py
          if [ -z "${DOPEIPTV_TMDB_KEY}" ]; then
            echo "::warning::DOPEIPTV_TMDB_KEY secret is empty - the built-in TMDB option will NOT appear in this build."
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Python build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip pillow
          # Build PyInstaller's BOOTLOADER FROM SOURCE rather than taking the
          # prebuilt wheel. Every PyInstaller app on earth ships the same
          # prebuilt bootloader bytes, and that is what several engines -
          # Defender included - carry signatures for, so an ordinary build
          # gets reported as a trojan on first run. Compiling it here gives
          # this binary its own bytes and clears the signature matches.
          # (Heuristic and reputation flags are a separate problem; the fix
          # for those is an authenticode signature, not a build flag.)
          python -m pip install --upgrade --no-binary pyinstaller pyinstaller
          python -m pip install -r requirements.txt
      - name: Fetch libmpv (mpv-2.dll)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p libmpv
          # Latest self-contained libmpv dev build (ffmpeg is baked in).
          # Authenticate the API call: unauthenticated GitHub API is 60 req/hr
          # on the runner's shared IP and got rate-limited, returning a body
          # with no "assets" key. That raised KeyError, and under this job's
          # continue-on-error it silently shipped a release with NO Windows zip
          # (v1.2.0). Auth lifts the limit to 1000/hr; empty URL now fails loud.
          #
          # The release lists several archives per architecture - a baseline
          # build, an x86-64-v3 (AVX2-only) build, LGPL variants - and a
          # substring test matched more than one, with the API's listing order
          # deciding which one shipped. The picker matches the whole name and
          # insists on exactly one hit (tools/pick_mpv_asset.py); it exits
          # non-zero with the response's head when there is none.
          api() {
            curl -sSL --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest
          }
          url=$(api | python tools/pick_mpv_asset.py ${{ matrix.mpv_arch }})
          echo "mpv-dev: $url"
          # -f: a 504 page is an error to retry, not an archive to unpack
          # (it was saved as mpv-dev.7z, 92 bytes, on 8 Nov 2026).
          curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors \
            -o mpv-dev.7z "$url"
          7z x mpv-dev.7z -ompv-dev
          dll=$(find mpv-dev -iname 'libmpv-2.dll' -o -iname 'mpv-2.dll' | head -1)
          echo "libmpv dll: $dll"
          cp "$dll" libmpv/mpv-2.dll
          ls -la libmpv
      - name: Vulkan loader (vulkan-1.dll)
        shell: bash
        env:
          # Bump deliberately: the pinned tag is what makes this reproducible.
          VULKAN_LOADER_TAG: v1.4.362
        run: |
          # libmpv hard-links vulkan-1.dll - the Khronos Vulkan loader - and
          # Windows does not ship it; graphics drivers install it. On a PC
          # whose driver predates Vulkan, in a VM, or on the basic display
          # adapter there is none, LoadLibrary(mpv-2.dll) fails outright, and
          # the app silently fell back to an external mpv (issue #19). The
          # self-check never saw it: this runner has a loader of its own.
          #
          # Build the loader from source at a pinned tag and drop it beside
          # mpv-2.dll. The spec ships every DLL in libmpv/, and a DLL's own
          # directory comes first in the search order Windows uses for its
          # dependencies, so the bundled copy is the one that loads on every
          # PC and the driver no longer matters. It is only a loader: with no
          # Vulkan driver it reports no devices, and the app renders through
          # OpenGL anyway. Apache-2.0; its notice ships beside it.
          git clone --quiet --depth 1 --branch "${VULKAN_LOADER_TAG}" \
            https://github.com/KhronosGroup/Vulkan-Loader vulkan-loader
          cmake -S vulkan-loader -B vulkan-loader/build -A ${{ matrix.cmake_arch }} \
            -D CMAKE_BUILD_TYPE=Release -D UPDATE_DEPS=ON -D BUILD_TESTS=OFF \
            -D BUILD_WERROR=OFF
          cmake --build vulkan-loader/build --config Release
          dll=$(find vulkan-loader/build -iname 'vulkan-1.dll' | head -1)
          if [ -z "$dll" ]; then
            echo "::error::Vulkan-Loader ${VULKAN_LOADER_TAG} built no vulkan-1.dll"
            exit 1
          fi
          cp "$dll" libmpv/vulkan-1.dll
          cp vulkan-loader/LICENSE.txt libmpv/LICENSE-Vulkan-Loader.txt
          ls -la libmpv
      - name: Build .ico from the app PNG
        shell: bash
        # windows-256.png, not the icons beside it: those carry the ~10%
        # margin macOS and GNOME ask for, and the Windows shell adds its own
        # padding on top - so a padded source would look small here. The
        # drift test in tests/test_packaging_icons.py covers this one too.
        run: |
          python -c "from PIL import Image; Image.open('packaging/icons/windows-256.png').save('packaging/dopeIPTV.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(python -c 'import dopeiptv;print(dopeiptv.VERSION)')" >> "$GITHUB_OUTPUT"
      - name: PyInstaller bundle
        shell: bash
        env:
          LIBMPV_DIR: ${{ github.workspace }}/libmpv
        run: pyinstaller --noconfirm dopeiptv-win.spec   # -> dist/dopeiptv/
      - name: Audit - what the shipped DLLs import
        shell: bash
        run: |
          # Every DLL that mpv-2.dll (and the loader) imports must be either
          # Windows' own or in the bundle beside it. The self-check below
          # cannot tell: mpv-2.dll loads on this runner whatever the image
          # happens to have installed. Reading the import tables can.
          python tools/win_dll_audit.py \
            dist/dopeiptv/_internal/mpv-2.dll dist/dopeiptv/_internal/vulkan-1.dll
      - name: Smoke test - self-check the frozen exe (libmpv + languages)
        shell: pwsh
        run: |
          # The exe is a windowed app, so PowerShell won't wait on its own -
          # Start-Process -Wait does. Exit code 0 = bundled libmpv loads, the
          # vulkan-1.dll it pulls in is the bundled copy (not the runner's),
          # AND every shipped language registers from the bundle.
          $p = Start-Process -FilePath "dist\dopeiptv\dopeiptv.exe" `
                 -ArgumentList "--self-check" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Error "self-check failed (exit $($p.ExitCode)) - libmpv or languages missing from the bundle"
            exit 1
          }
          Write-Output "self-check OK"
      - name: Smoke test - start the app and photograph its window
        # Nobody here has a Windows PC: this starts the real app, as a user
        # would, and keeps a picture of the screen with the build. It does
        # not stop a build yet - the runner has no graphics card, and a
        # crash that only a GPU-less machine shows must not cost a release.
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\dopeiptv\dopeiptv.exe" -PassThru
          Start-Sleep -Seconds 15
          $p.Refresh()
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("windows-start-${{ matrix.arch }}.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
          if ($p.HasExited) {
            Write-Error "the app exited within 15 s of starting (exit code $($p.ExitCode))"
            exit 1
          }
          Write-Output "running after 15 s - window: '$($p.MainWindowTitle)' (handle $($p.MainWindowHandle))"
          Stop-Process -Id $p.Id -Force
      - name: Keep the picture of the started app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-start-${{ matrix.arch }}
          path: windows-start-*.png
          if-no-files-found: ignore
      - name: Installer (NSIS)
        shell: bash
        run: |
          # Per user, no administrator (packaging/windows/dopeiptv.nsi): a
          # Start menu entry, an entry under Settings -> Apps, and what the
          # app's own update runs silently. NSIS (zlib licence) is on the
          # x64 image; elsewhere it comes from Chocolatey.
          V=${{ steps.v.outputs.version }}
          A=${{ matrix.arch }}
          MAKENSIS=$(command -v makensis || true)
          for c in "/c/Program Files (x86)/NSIS/makensis.exe" "/c/Program Files/NSIS/makensis.exe"; do
            [ -z "$MAKENSIS" ] && [ -x "$c" ] && MAKENSIS="$c"
          done
          if [ -z "$MAKENSIS" ]; then
            choco install nsis -y --no-progress
            for c in "/c/Program Files (x86)/NSIS/makensis.exe" "/c/Program Files/NSIS/makensis.exe"; do
              [ -z "$MAKENSIS" ] && [ -x "$c" ] && MAKENSIS="$c"
            done
          fi
          [ -n "$MAKENSIS" ] || { echo "::error::makensis not found"; exit 1; }
          "$MAKENSIS" -VERSION
          V4=$(python -c "import sys; p = sys.argv[1].split('.'); print('.'.join((p + ['0'] * 4)[:4]))" "$V")
          "$MAKENSIS" -V3 -DVERSION="$V" -DVERSION4="$V4" -DARCH="$A" \
            -DSRC="$(cygpath -w "$PWD/dist/dopeiptv")" -DICON="$(cygpath -w "$PWD/packaging/dopeIPTV.ico")" \
            -DOUT="$(cygpath -w "$PWD/dopeIPTV-${V}-windows-${A}-setup.exe")" packaging/windows/dopeiptv.nsi
          ls -la ./*-setup.exe
      - name: Smoke test - install, update over it, start, and remove
        shell: pwsh
        run: |
          # What a user's machine does with the installer: install, install
          # the next one over it the way the app's update does (silently,
          # opening the app again), self-check the installed copy, remove it.
          $v = "${{ steps.v.outputs.version }}"
          $setup = (Resolve-Path "dopeIPTV-$v-windows-${{ matrix.arch }}-setup.exe").Path
          $dir = Join-Path $env:RUNNER_TEMP "dopeIPTV-installed"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\dopeIPTV"
          $lnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\dopeIPTV.lnk"
          $p = Start-Process -FilePath $setup -ArgumentList "/S", "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exit $($p.ExitCode)"; exit 1 }
          $p = Start-Process -FilePath $setup -ArgumentList "/S", "/relaunch", "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installing over it: exit $($p.ExitCode)"; exit 1 }
          Start-Sleep -Seconds 5
          $run = Get-Process -Name dopeiptv -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$dir*" }
          if (-not $run) { Write-Error "/relaunch did not open the installed app"; exit 1 }
          $run | Stop-Process -Force
          Start-Sleep -Seconds 2
          $reg = Get-ItemProperty $key
          if ($reg.DisplayVersion -ne $v -or $reg.Publisher -ne "Solecraft AB") {
            Write-Error "Settings -> Apps entry: version '$($reg.DisplayVersion)', publisher '$($reg.Publisher)'"; exit 1
          }
          if (-not (Test-Path $lnk)) { Write-Error "no Start menu entry"; exit 1 }
          $p = Start-Process -FilePath "$dir\dopeiptv.exe" -ArgumentList "--self-check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "self-check of the installed app failed (exit $($p.ExitCode))"; exit 1 }
          # _?= keeps the uninstaller where it is, so Start-Process waits for it.
          $p = Start-Process -FilePath "$dir\uninstall.exe" -ArgumentList "/S", "_?=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "uninstaller exit $($p.ExitCode)"; exit 1 }
          foreach ($left in @("$dir\dopeiptv.exe", "$dir\_internal", $key, $lnk)) {
            if (Test-Path $left) { Write-Error "left behind after removal: $left"; exit 1 }
          }
          Write-Output "installed, updated over, relaunched, self-checked and removed: OK"
      - name: Package portable zip
        shell: bash
        run: |
          V=${{ steps.v.outputs.version }}
          # Ship a plain-text README in the folder: how to run past SmartScreen,
          # make a shortcut, and remove every trace of the app.
          cp packaging/WINDOWS-README.txt "dist/dopeiptv/README.txt"
          ( cd dist && 7z a "../dopeIPTV-${V}-windows-${{ matrix.arch }}.zip" dopeiptv )
          ls -la *.zip
      # Public release: attach the portable zip when a version tag is pushed.
      # (Unzip once -> a runnable dopeiptv\ folder; the README covers
      # SmartScreen, the shortcut, and full removal.) The Linux/macOS jobs run
      # independently and attach their own assets, so a Windows failure marks
      # the run red without removing those.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *-setup.exe
          body_path: RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: dopeIPTV-windows-setup-${{ matrix.arch }}
          path: '*-setup.exe'
      # Also upload the app FOLDER (not the .zip) as a CI artifact for testing:
      # the Actions artifact download UI always re-zips whatever you give it, so
      # uploading our .zip produced a zip-in-a-zip. Uploading the folder means
      # one unzip yields the runnable dopeiptv\ directory.
      - uses: actions/upload-artifact@v4
        with:
          name: dopeIPTV-windows-${{ matrix.arch }}
          path: dist/dopeiptv

  # --------------------------------------------------------------- Flatpak ---
  # Most likely to need iteration (building libmpv in Flatpak). Kept from
  # blocking the release with continue-on-error.
  flatpak:
    name: Flatpak (experimental)
    if: ${{ (inputs.replace_macos_dmg || '') == '' }}
    # Only the host: the build runs in the container below. Pinned for the
    # same reason as python-dist.
    runs-on: ubuntu-24.04
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - name: Nightly version
        if: ${{ inputs.nightly_version }}
        shell: bash
        env:
          V: ${{ inputs.nightly_version }}
        run: |
          # A test build is named and versioned after its build: the app,
          # the wheel and every package say 1.4.0.123, not 1.4.0.
          sed -i.bak -E "s/^__version__ = \"[^\"]*\"/__version__ = \"${V}\"/" dopeiptv/__init__.py
          sed -i.bak -E "s/^version = \"[^\"]*\"/version = \"${V}\"/" pyproject.toml
          rm -f dopeiptv/*.bak ./*.bak
          grep -q "^__version__ = \"${V}\"" dopeiptv/__init__.py
          grep -q "^version = \"${V}\"" pyproject.toml
          echo "Nightly build ${V}"
      - name: Guard - release notes must match this version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # The release body comes from RELEASE_NOTES.md and the artifacts are
          # built from whatever the tag points at, so three things must agree
          # or the release is a lie: the tag, the package version, the notes.
          #
          # v1.1.0 shipped with 1.0.0's notes because nothing checked the file.
          # v1.2.3 then shipped 1.2.2's code AND notes, because the tag landed
          # on a commit made before the version bump - and this guard only
          # compared the notes against __version__, which agreed with itself
          # perfectly at 1.2.2. Check the TAG too.
          TAG=${GITHUB_REF#refs/tags/v}
          VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' dopeiptv/__init__.py)
          if [ "${TAG}" != "${VER}" ]; then
            echo "::error::Tag v${TAG} sits on a commit whose __version__ is ${VER} - wrong commit, or the bump was never committed."
            exit 1
          fi
          if ! grep -q "dopeIPTV ${VER}" RELEASE_NOTES.md; then
            echo "::error::RELEASE_NOTES.md is stale: no 'dopeIPTV ${VER}' heading. Update it before tagging."
            exit 1
          fi
          echo "Tag, version and release notes all agree on ${VER}."
      - name: Bake built-in OpenSubtitles key
        shell: bash
        env:
          DOPEIPTV_OPENSUBTITLES_KEY: ${{ secrets.DOPEIPTV_OPENSUBTITLES_KEY }}
        run: |
          printf 'OPENSUBTITLES_API_KEY = "%s"\n' "${DOPEIPTV_OPENSUBTITLES_KEY}" > dopeiptv/_opensubtitles_key.py
          if [ -z "${DOPEIPTV_OPENSUBTITLES_KEY}" ]; then
            echo "::warning::DOPEIPTV_OPENSUBTITLES_KEY secret is empty - subtitles from OpenSubtitles need a key in Settings in this build."
          fi
      - name: Bake built-in TMDB key
        env:
          DOPEIPTV_TMDB_KEY: ${{ secrets.DOPEIPTV_TMDB_KEY }}
        run: |
          printf 'TMDB_API_KEY = "%s"\n' "${DOPEIPTV_TMDB_KEY}" > dopeiptv/_tmdb_key.py
          if [ -n "${DOPEIPTV_TMDB_KEY}" ]; then
            echo "Built-in TMDB key baked in (${#DOPEIPTV_TMDB_KEY} chars)."
          else
            echo "::warning::DOPEIPTV_TMDB_KEY secret is empty - the built-in TMDB option will NOT appear in this build."
          fi
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: dopeIPTV.flatpak
          manifest-path: packaging/flatpak/io.github.slimture.dopeIPTV.yaml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Smoke test - install flatpak and verify metadata
        run: |
          # The flatpak-github-actions container is stripped down to
          # flatpak+build tools and has neither apt-get, yum nor dnf, so we
          # can't add xvfb and do a full launch here. Instead verify that:
          #   1) the bundle installs into the system repo cleanly, and
          #   2) 'flatpak info' can read every key it needs to launch (the
          #      runtime it wants, the binary path, the app-id).
          # A full launch smoke happens once a user downloads it. If the
          # bundle format itself were broken, install would fail with a
          # 'no such ref' or 'corrupt metadata' error - that IS caught here.
          echo "::group::Install"
          flatpak install --system --bundle --noninteractive --assumeyes \
            dopeIPTV.flatpak
          echo "::endgroup::"
          echo "::group::Inspect installed app"
          flatpak info io.github.slimture.dopeIPTV
          flatpak info --show-runtime io.github.slimture.dopeIPTV
          echo "::endgroup::"
      - name: Name the bundle with the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Match the other assets (dopeIPTV-0.6.4-...): strip the tag's leading
          # 'v' so the flatpak carries the version instead of a bare name.
          V="${GITHUB_REF_NAME#v}"
          mv dopeIPTV.flatpak "dopeIPTV-${V}.flatpak"
          echo "BUNDLE=dopeIPTV-${V}.flatpak" >> "$GITHUB_ENV"
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BUNDLE }}
          body_path: RELEASE_NOTES.md
