[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dopeiptv"
# MUST stay in lock-step with dopeiptv/__init__.py's __version__. A test
# (tests/test_version.py) fails the build if they drift, so a release can't
# ship an sdist named after the wrong version again. Bump BOTH on a release.
version = "1.6.1"
description = "Modern IPTV player"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

dependencies = [
    # Lower bounds = the oldest tested; upper bounds guard against a future
    # major release changing an API out from under a build without a deliberate
    # bump here (reproducible-ish builds without a full lockfile to maintain).
    "PyQt6>=6.5,<7",
    "requests>=2.28,<3",
    "python-mpv>=1.0,<2",
    "pychromecast>=13.0,<15",
    # The system's media controls, each only on its own system (see
    # requirements.txt): Now Playing on macOS, the SMTC on Windows.
    "pyobjc-framework-MediaPlayer>=10.0,<14; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0,<14; sys_platform == 'darwin'",
    # AirPlay to an Apple TV, macOS only (see requirements.txt).
    "pyobjc-framework-AVFoundation>=10.0,<14; sys_platform == 'darwin'",
    "pyobjc-framework-AVKit>=10.0,<14; sys_platform == 'darwin'",
    "winrt-runtime>=4.0,<5; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=4!10.0.28000,<5!0; sys_platform == 'win32'",
    "winrt-Windows.Media>=4!10.0.28000,<5!0; sys_platform == 'win32'",
    "winrt-Windows.Media.Playback>=4!10.0.28000,<5!0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=4!10.0.28000,<5!0; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://dopeiptv.org/"
Documentation = "https://dopeiptv.org/help/"
Source = "https://github.com/slimture/dopeIPTV"
Issues = "https://github.com/slimture/dopeIPTV/issues"
Donate = "https://dopeiptv.org/#donate"

[project.scripts]
dopeiptv = "dopeiptv.launcher:main"

[tool.setuptools.packages.find]
include = ["dopeiptv*"]

[tool.setuptools.package-data]
# Ship the add-on locale JSONs (Turkish, Portuguese, Arabic, …) inside the
# wheel/sdist; i18n.py loads them at import from dopeiptv/locale/.
# And the signed list of the package's files, when the build made one (the
# Flatpak: tools/build_manifest.py tree; dopeiptv/core/build_check.py).
dopeiptv = ["locale/*.json", "assets/*.svg", "assets/flags/*.svg", "assets/flags/LICENSE", "assets/flags/SOURCE.txt",
            "_build_manifest.json", "_build_manifest.json.sig"]

[tool.mypy]
# Type gate scoped to the pure-logic layer (data, network, services) — the
# highest-value, most-tested code. The Qt-heavy UI is deliberately NOT gated:
# main_window.py is assembled from many mw_* mixins that reference shared
# `self.<attr>` defined across sibling mixins, which mypy (seeing each class in
# isolation) reports as ~1200 false `attr-defined` errors; plus PyQt6's stubs
# mark most accessors Optional, producing union-attr/call-overload noise that
# would need a wall of asserts and `# type: ignore` to silence. Gating those
# would lower signal, not raise it. follow_imports=silent resolves imported
# modules for types without reporting their own errors, so this stays scoped.
# Expand `files` as more pure-logic modules get typed.
python_version = "3.11"
ignore_missing_imports = true
# Untyped third-party libs (requests, PyQt6, python-mpv, ...) become Any rather
# than erroring, so the gate is deterministic without pinning stub packages -
# our own code is still fully checked.
disable_error_code = ["import-untyped"]
follow_imports = "silent"
files = [
    "dopeiptv/providers/client.py",
    "dopeiptv/providers/epg.py",
