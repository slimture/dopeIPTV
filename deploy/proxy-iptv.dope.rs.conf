# TLS-front proxy - the old address, iptv.dope.rs. Since November 2026 the
# site is dopeiptv.org (proxy-dopeiptv.org.conf); this name only sends every
# request on to the same path there, for good: older versions of the app,
# links out on the web and search engines still have it.
# Place at: /usr/local/etc/nginx/conf.d/iptv.dope.rs.conf
#
# Keep its certificate renewing (the port-80 block below answers certbot):
# https://iptv.dope.rs/... has to answer with the move, not a certificate
# error. Its CSP row in nginx.conf can stay; a redirect has no page to
# protect.

server {
    listen 0.0.0.0:443 ssl;
    http2 on;
    server_name iptv.dope.rs;

    # The certificate iptv.dope.rs has used all along.
    ssl_certificate     /usr/local/etc/letsencrypt/live/YOURCERT/fullchain.pem;
    ssl_certificate_key /usr/local/etc/letsencrypt/live/YOURCERT/privkey.pem;

    return 301 https://dopeiptv.org$request_uri;
}

# Plain http://, if nginx.conf does not already send all port-80 traffic to
# https:// (then leave this block out: https://iptv.dope.rs sends it on).
server {
    listen 0.0.0.0:80;
    server_name iptv.dope.rs;

    location /.well-known/acme-challenge/ { root /usr/local/www/letsencrypt; }
    location / { return 301 https://dopeiptv.org$request_uri; }
}
