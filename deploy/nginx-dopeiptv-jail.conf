worker_processes auto;
error_log /var/log/nginx/error.log crit;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type text/html;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    gzip on;
    charset utf-8;
    server_tokens off;
    access_log off;
    include /usr/local/etc/nginx/conf.d/*.conf;
}
