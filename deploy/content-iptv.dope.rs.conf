# Content server — for iptv.dope.rs (behind the TLS-front proxy)
# Place at: /usr/local/etc/nginx/conf.d/iptv.dope.rs.conf  (included by nginx.conf)
#
# A static site: no PHP anywhere, and nothing here talks to php-fpm.
# sync-releases.sh (one level above the web root, run by cron) renders every
# page in every language into public/i18n/<lang>/; this file picks the one a
# visitor gets, with the rules index.php used:
#
#   1. ?lang=xx, which also sets the lang cookie for a year;
#   2. else the lang cookie;
#   3. else the browser's Accept-Language - the first language in its list
#      that the site has, region and q-values ignored;
#   4. else English.
#
# The same address answers in different languages, so a page chosen by the
# cookie or the browser says so with Vary, as before. The map blocks must be
# at http level, which a file in conf.d/ is.

# -- the language ---------------------------------------------------------------

# Exactly as given (index.php compared ?lang= and the cookie case-sensitively).
map $arg_lang $iptv_lang_arg {
    default "";
    ~^(en|ar|zh|hr|nl|fr|de|el|he|hi|id|it|ja|ko|fa|pl|pt|ru|sr|es|sw|sv|th|tr|uk|ur|vi)$ $1;
}
map $cookie_lang $iptv_lang_cookie {
    default "";
    ~^(en|ar|zh|hr|nl|fr|de|el|he|hi|id|it|ja|ko|fa|pl|pt|ru|sr|es|sw|sv|th|tr|uk|ur|vi)$ $1;
}
# The first entry of the list, in its order, whose language (before any
# "-region") the site has: "nb-NO, sv;q=0.8, en;q=0.5" is Swedish.
map $http_accept_language $iptv_lang_browser {
    default "";
    "~*^(?:[^,]*,)*?[ \t]*(?<iptv_al>en|ar|zh|hr|nl|fr|de|el|he|hi|id|it|ja|ko|fa|pl|pt|ru|sr|es|sw|sv|th|tr|uk|ur|vi)(?:-[^,;]*)?[ \t]*(?:;[^,]*)?(?:,|$)" $iptv_al;
}
# ...in lower case, as the page directories are named.
map $iptv_lang_browser $iptv_lang_browser_lc {
    default "";
    ~*^en$ en; ~*^ar$ ar; ~*^zh$ zh; ~*^hr$ hr; ~*^nl$ nl; ~*^fr$ fr;
    ~*^de$ de; ~*^el$ el; ~*^he$ he; ~*^hi$ hi; ~*^id$ id; ~*^it$ it;
    ~*^ja$ ja; ~*^ko$ ko; ~*^fa$ fa; ~*^pl$ pl; ~*^pt$ pt; ~*^ru$ ru;
    ~*^sr$ sr; ~*^es$ es; ~*^sw$ sw; ~*^sv$ sv; ~*^th$ th; ~*^tr$ tr;
    ~*^uk$ uk; ~*^ur$ ur; ~*^vi$ vi;
}
map "$iptv_lang_arg:$iptv_lang_cookie:$iptv_lang_browser_lc" $iptv_lang {
    ~^(?<iptv_l1>[a-z]+): $iptv_l1;
    ~^:(?<iptv_l2>[a-z]+): $iptv_l2;
    ~^::(?<iptv_l3>[a-z]+)$ $iptv_l3;
    default en;
}
# Chosen by ?lang=: remembered. Chosen otherwise: varies by visitor.
map $iptv_lang_arg $iptv_set_cookie {
    "" "";
    default "lang=$iptv_lang_arg; Max-Age=31536000; path=/";
}
map $iptv_lang_arg $iptv_vary {
    "" "Accept-Language, Cookie";
    default "";
}

# dl.php's file name: the last path segment of ?f=, never one starting with
# a dot. Anything else is answered 404.
map $arg_f $iptv_dl_file {
    default "";
    "~^(?:.*/)?(?<iptv_f>[A-Za-z0-9_~-][A-Za-z0-9._~-]*)$" $iptv_f;
}

server {
    listen 8081;               # dedicated port; the TLS-front proxy proxies here
    server_name iptv.dope.rs;

    root  /usr/local/www/iptv/public;
    index index.html;

    absolute_redirect off;
    port_in_redirect  off;
    server_tokens off;

    charset utf-8;

    # The site's own "page not found", in the visitor's language, still
    # answered with status 404 so nothing indexes it.
    error_page 404 /404.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # -- the pages ------------------------------------------------------------
    # No-cache: a returning visitor always checks for a new page (a new
    # release, new counts) - the PHP pages were never cached either.
    location = / {
        add_header Vary $iptv_vary;
        add_header Set-Cookie $iptv_set_cookie;
        add_header Cache-Control "no-cache";
        try_files /i18n/$iptv_lang/index.html =404;
    }
    location = /help/ {
        add_header Vary $iptv_vary;
        add_header Set-Cookie $iptv_set_cookie;
        add_header Cache-Control "no-cache";
        try_files /i18n/$iptv_lang/help/index.html =404;
    }
    location = /help {
        return 301 /help/$is_args$args;
    }
    location = /404.html {
        internal;
        add_header Vary $iptv_vary always;
        add_header Set-Cookie $iptv_set_cookie always;
        add_header Cache-Control "no-cache" always;
        try_files /i18n/$iptv_lang/404.html =404;
    }
    # Only ever served through the locations above.
    location ^~ /i18n/ {
        internal;
    }

    # The old 404.php, asked for by name, read ?lang= as the pages do; the
    # page for an address that does not exist never sees it.
    location = /404.php {
        error_page 404 /404.html$is_args$args;
        return 404;
    }

    # One address per page: the old /index.php and /help/index.php go home.
    location = /index.php {
        return 301 /$is_args$args;
    }
    location = /help/index.php {
        return 301 /help/$is_args$args;
    }

    # The sitemap stays where sitemap.xml (the index) points.
    location = /sitemap.php {
        types { }
        default_type application/xml;
        charset_types application/xml;
        add_header Vary $iptv_vary;
        add_header Set-Cookie $iptv_set_cookie;
        try_files /i18n/sitemap.xml =404;
    }

    # Every download link goes through /dl.php?f=NAME, which sends the browser
    # on to /files/NAME. Only a file that is there; anything else is plain
    # "Not found". These requests, and only these, go to a log of their own,
    # where sync-releases.sh counts the downloads (newsyslog keeps .0
    # uncompressed for it, see DEPLOY.md).
    location = /dl.php {
        access_log /var/log/nginx/iptv.dope.rs-downloads.log combined;
        default_type text/plain;
        if ($iptv_dl_file = "") {
            return 404 "Not found";
        }
        if (!-f $document_root/files/$iptv_dl_file) {
            return 404 "Not found";
        }
        return 302 /files/$iptv_dl_file;
    }

    # Trakt's browser sign-in for the dopeIPTV app comes back here (the
    # redirect URI registered with Trakt) and goes straight on to the app on
    # the user's own machine. Only the OAuth answer is passed on, and only to
    # that one fixed address: no open redirect. Changing the address or the
    # port means changing the app (trakt.WEB_REDIRECT_URI, OAUTH_PORT) and the
    # Trakt app's registered redirect URI too.
    location = /trakt/callback {
        return 301 /trakt/callback/$is_args$args;
    }
    location ~ ^/trakt/callback/(?:index\.php)?$ {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        set $iptv_trakt "";
        if ($arg_code ~ "^.{1,2048}$") {
            set $iptv_trakt "&code=$arg_code";
        }
        if ($arg_state ~ "^.{1,2048}$") {
            set $iptv_trakt "$iptv_trakt&state=$arg_state";
        }
        if ($arg_error ~ "^.{1,2048}$") {
            set $iptv_trakt "$iptv_trakt&error=$arg_error";
        }
        if ($arg_error_description ~ "^.{1,2048}$") {
            set $iptv_trakt "$iptv_trakt&error_description=$arg_error_description";
        }
        if ($iptv_trakt ~ "^&(?<iptv_tq>.+)$") {
            return 302 "http://127.0.0.1:41794/callback?$iptv_tq";
        }
        return 302 http://127.0.0.1:41794/callback;
    }
    location = /trakt/ {
        return 403;
    }

    # -- static files -----------------------------------------------------------

    # Long-cache the immutable release files, and ALWAYS serve them as a binary
    # download. Without this, extensions nginx's mime.types doesn't know
    # (.AppImage, .deb, …) fall back to `default_type text/html`, so the browser
    # tries to *render* the binary instead of downloading it - clicking a
    # download then appears to "do nothing".
    location /files/ {
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    # Every page links CSS and JS with the file's content hash in the URL
    # (?v=..., worked out by sync-releases.sh): a changed file gets a new URL,
    # so the old one can be cached for good.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Images and the manifest keep their names when they change: a week.
    location ~* \.(svg|png|ico|webp|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }

    # No PHP is served from here. A .php file left behind by an old deploy is
    # not run and not shown either: it does not exist.
    location ~ \.php$ {
        return 404;
    }
}
