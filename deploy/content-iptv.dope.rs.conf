# Content server — for iptv.dope.rs (behind the TLS-front proxy)
# Place at: /usr/local/etc/nginx/conf.d/iptv.dope.rs.conf  (included by nginx.conf)
#
# A static site: no PHP anywhere, and nothing here talks to php-fpm.
# sync-releases.sh (one level above the web root, run by cron) renders every
# page in every language into public/i18n/<lang>/; this file picks the one a
# visitor gets, with the rules index.php used:
#
#   1. ?lang=xx, which also sets the lang cookie for a year;
#   2. else the lang cookie;
#   3. else the browser's Accept-Language - the first language in its list
#      that the site has, region and q-values ignored;
#   4. else English.
#
# The same address answers in different languages, so a page chosen by the
# cookie or the browser says so with Vary, as before. The map blocks must be
# at http level, which a file in conf.d/ is.

# -- the language ---------------------------------------------------------------

# Exactly as given (index.php compared ?lang= and the cookie case-sensitively).
map $arg_lang $iptv_lang_arg {
    default "";
    ~^(en|ar|zh|hr|nl|fr|de|el|he|hi|id|it|ja|ko|fa|pl|pt|ru|sr|es|sw|sv|th|tr|uk|ur|vi)$ $1;
}
map $cookie_lang $iptv_lang_cookie {
    default "";
    ~^(en|ar|zh|hr|nl|fr|de|el|he|hi|id|it|ja|ko|fa|pl|pt|ru|sr|es|sw|sv|th|tr|uk|ur|vi)$ $1;
}
# The first entry of the list, in its order, whose language (before any
# "-region") the site has: "nb-NO, sv;q=0.8, en;q=0.5" is Swedish.
map $http_accept_language $iptv_lang_browser {
    default "";
    "~*^(?:[^,]*,)*?[ \t]*(?<iptv_al>en|ar|zh|hr|nl|fr|de|el|he|hi|id|it|ja|ko|fa|pl|pt|ru|sr|es|sw|sv|th|tr|uk|ur|vi)(?:-[^,;]*)?[ \t]*(?:;[^,]*)?(?:,|$)" $iptv_al;
}
# ...in lower case, as the page directories are named.
map $iptv_lang_browser $iptv_lang_browser_lc {
    default "";
    ~*^en$ en; ~*^ar$ ar; ~*^zh$ zh; ~*^hr$ hr; ~*^nl$ nl; ~*^fr$ fr;
    ~*^de$ de; ~*^el$ el; ~*^he$ he; ~*^hi$ hi; ~*^id$ id; ~*^it$ it;
    ~*^ja$ ja; ~*^ko$ ko; ~*^fa$ fa; ~*^pl$ pl; ~*^pt$ pt; ~*^ru$ ru;
    ~*^sr$ sr; ~*^es$ es; ~*^sw$ sw; ~*^sv$ sv; ~*^th$ th; ~*^tr$ tr;
    ~*^uk$ uk; ~*^ur$ ur; ~*^vi$ vi;
}
map "$iptv_lang_arg:$iptv_lang_cookie:$iptv_lang_browser_lc" $iptv_lang {
    ~^(?<iptv_l1>[a-z]+): $iptv_l1;
    ~^:(?<iptv_l2>[a-z]+): $iptv_l2;
    ~^::(?<iptv_l3>[a-z]+)$ $iptv_l3;
    default en;
}
# Chosen by ?lang=: remembered. Chosen otherwise: varies by visitor.
map $iptv_lang_arg $iptv_set_cookie {
    "" "";
    default "lang=$iptv_lang_arg; Max-Age=31536000; path=/";
}
map $iptv_lang_arg $iptv_vary {
    "" "Accept-Language, Cookie";
    default "";
}

# dl.php's file name: the last path segment of ?f=, never one starting with
# a dot. Anything else is answered 404.
map $arg_f $iptv_dl_file {
    default "";
    "~^(?:.*/)?(?<iptv_f>[A-Za-z0-9_~-][A-Za-z0-9._~-]*)$" $iptv_f;
}

# -- donations ------------------------------------------------------------------
# The donate dialog's small service (donate/donate.py, started by
# deploy/iptv_donate) listens on a Unix socket, and only /donate/ reaches it.
# Counted per visitor: $remote_addr here is the TLS-front proxy, X-Real-IP the
# visitor (the proxy sets it, overwriting whatever a client sent).
limit_req_zone $http_x_real_ip zone=iptv_donate:1m rate=10r/m;

# -- statistics -----------------------------------------------------------------
# One line per page view (only / and /help/ are logged here), read every
# quarter hour by donate/stats_collect.py, which keeps nothing but counts per
# day for the admin page. The address is in the log, as in any access log;
# newsyslog (DEPLOY.md "Statistics") keeps a week of it.
log_format iptv_stats escape=json
    '{"ip":"$http_x_real_ip","t":"$time_iso8601","m":"$request_method",'
    '"u":"$request_uri","s":$status,"r":"$http_referer","a":"$http_user_agent",'
    '"l":"$iptv_lang"}';
# A browser that has opened the admin page (donate.py sets iptv_nostats) is
# the site's owner testing: neither its page views nor its downloads are
# logged, so neither the statistics nor the public download counter count it.
map $cookie_iptv_nostats $iptv_count {
    default 1;
    "1"     0;
}
# /dl.php's log: nginx's "combined", plus the visitor's address as a last
# field ($remote_addr is the TLS proxy), so stats_collect.py can count a
# visitor once per file per day. sync-releases.sh reads fields 2, 3 and 6
# and does not see it.
log_format iptv_dl '$remote_addr - $remote_user [$time_local] "$request" $status '
    '$body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_real_ip"';
# /hit: what a page tells when it is shown (nav.js) - a few per visit.
limit_req_zone $http_x_real_ip zone=iptv_hit:1m rate=60r/m;
# The admin page, a little more patient than /donate/: a browser that holds
# the session cookie is not counted (an empty key is not) - every file of
# the page counted, and a few reloads on the phone used the minute up and
# left the page without its stylesheet and script. A forged cookie gets
# nothing (donate.py checks its signature).
map $cookie_iptv_admin $iptv_admin_limit {
    ""         $http_x_real_ip;
    default    "";
}
limit_req_zone $iptv_admin_limit zone=iptv_admin:1m rate=30r/m;
# Signing in (/admin/auth/): counted for everyone, cookie or not. donate.py
# also holds back an address or a name after ten failures in 15 minutes.
limit_req_zone $http_x_real_ip zone=iptv_signin:1m rate=20r/m;

server {
    listen 8081;               # dedicated port; the TLS-front proxy proxies here
    # dopeiptv.org since November 2026; the TLS-front proxy sends iptv.dope.rs
    # on to it, so the old name is only here for a request that slips past.
    server_name dopeiptv.org iptv.dope.rs;

    root  /usr/local/www/iptv/public;
    index index.html;

    absolute_redirect off;
    port_in_redirect  off;
    server_tokens off;

    charset utf-8;

    # The site's own "page not found", in the visitor's language, still
    # answered with status 404 so nothing indexes it.
    error_page 404 /404.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # -- the pages ------------------------------------------------------------
    # No-cache: a returning visitor always checks for a new page (a new
    # release, new counts) - the PHP pages were never cached either.
    location = / {
        access_log /var/log/nginx/iptv.dope.rs-stats.log iptv_stats if=$iptv_count;
        add_header Vary $iptv_vary;
        add_header Set-Cookie $iptv_set_cookie;
        add_header Cache-Control "no-cache";
        try_files /i18n/$iptv_lang/index.html =404;
    }
    location = /help/ {
        access_log /var/log/nginx/iptv.dope.rs-stats.log iptv_stats if=$iptv_count;
        add_header Vary $iptv_vary;
        add_header Set-Cookie $iptv_set_cookie;
        add_header Cache-Control "no-cache";
        try_files /i18n/$iptv_lang/help/index.html =404;
    }
    location = /help {
        return 301 /help/$is_args$args;
    }
    location = /404.html {
        internal;
        add_header Vary $iptv_vary always;
        add_header Set-Cookie $iptv_set_cookie always;
        add_header Cache-Control "no-cache" always;
        try_files /i18n/$iptv_lang/404.html =404;
    }
    # Only ever served through the locations above.
    location ^~ /i18n/ {
        internal;
    }

    # The old 404.php, asked for by name, read ?lang= as the pages do; the
    # page for an address that does not exist never sees it.
    location = /404.php {
        error_page 404 /404.html$is_args$args;
        return 404;
    }

    # One address per page: the old /index.php and /help/index.php go home.
    location = /index.php {
        return 301 /$is_args$args;
    }
    location = /help/index.php {
        return 301 /help/$is_args$args;
    }
    # Links that name the app as a path, the way GitHub's address does
    # (/dopeIPTV), mean the front page.
    location ~* ^/dopeiptv/?$ {
        return 301 /$is_args$args;
    }

    # The sitemap stays where sitemap.xml (the index) points.
    location = /sitemap.php {
        types { }
        default_type application/xml;
        charset_types application/xml;
        add_header Vary $iptv_vary;
        add_header Set-Cookie $iptv_set_cookie;
        try_files /i18n/sitemap.xml =404;
    }

    # Every download link goes through /dl.php?f=NAME, which sends the browser
    # on to /files/NAME. Only a file that is there; anything else is plain
    # "Not found". These requests, and only these, go to a log of their own,
    # where sync-releases.sh counts the downloads (newsyslog keeps .0
    # uncompressed for it, see DEPLOY.md).
    location = /dl.php {
        access_log /var/log/nginx/iptv.dope.rs-downloads.log iptv_dl if=$iptv_count;
        default_type text/plain;
        if ($iptv_dl_file = "") {
            return 404 "Not found";
        }
        if (!-f $document_root/files/$iptv_dl_file) {
            return 404 "Not found";
        }
        return 302 /files/$iptv_dl_file;
    }

    # Trakt's browser sign-in for the dopeIPTV app comes back here (the
    # redirect URI registered with Trakt) and goes straight on to the app on
    # the user's own machine. Only the OAuth answer is passed on, and only to
    # that one fixed address: no open redirect. Changing the address or the
    # port means changing the app (trakt.WEB_REDIRECT_URI, OAUTH_PORT) and the
    # Trakt app's registered redirect URI too.
    location = /trakt/callback {
        return 301 /trakt/callback/$is_args$args;
    }
    location ~ ^/trakt/callback/(?:index\.php)?$ {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        set $iptv_trakt "";
        if ($arg_code ~ "^.{1,2048}$") {
            set $iptv_trakt "&code=$arg_code";
        }
        if ($arg_state ~ "^.{1,2048}$") {
            set $iptv_trakt "$iptv_trakt&state=$arg_state";
        }
        if ($arg_error ~ "^.{1,2048}$") {
            set $iptv_trakt "$iptv_trakt&error=$arg_error";
        }
        if ($arg_error_description ~ "^.{1,2048}$") {
            set $iptv_trakt "$iptv_trakt&error_description=$arg_error_description";
        }
        if ($iptv_trakt ~ "^&(?<iptv_tq>.+)$") {
            return 302 "http://127.0.0.1:41794/callback?$iptv_tq";
        }
        return 302 http://127.0.0.1:41794/callback;
    }
    location = /trakt/ {
        return 403;
    }

    # -- donations --------------------------------------------------------------
    # The dialog asks /donate/config when it opens and /donate/session or
    # /donate/wallet to pay. Not running, the dialog goes to Stripe's own
    # page instead, so the site works before the service does.
    location ^~ /donate/ {
        limit_req zone=iptv_donate burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        proxy_pass http://unix:/var/run/iptv_donate/donate.sock;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Admin-User "";      # only /admin/ below names one
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # Apple Pay reads this once, when the domain is added in Stripe (Settings
    # -> Payment method domains). It is Stripe's file, the same for everyone.
    location = /.well-known/apple-developer-merchantid-domain-association {
        default_type text/plain;
        try_files $uri =404;
    }

    # -- statistics -------------------------------------------------------------
    # A page tells /hit when it is shown in a browser, how long it was looked
    # at, and the donate dialog's opening (nav.js); only the log line counts.
    location = /hit {
        limit_req zone=iptv_hit burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        access_log /var/log/nginx/iptv.dope.rs-stats.log iptv_stats if=$iptv_count;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 204;
    }

    # -- the admin page ---------------------------------------------------------
    # Statistics and donations (donate/admin.py), for its admins only. A
    # browser signs in once and holds a cookie signed by donate.py, which
    # nginx has it check (auth_request) and names the admin to the service;
    # the service checks the session again itself, so losing auth_request
    # here still lets no one in without one. Anyone else is sent to the
    # sign-in page (passkeys, a password and perhaps an authenticator code -
    # donate/admin_auth.py), which is open, as are the files it needs.
    location = /admin {
        return 301 /admin/;
    }
    location ^~ /admin/ {
        limit_req zone=iptv_admin burst=30 nodelay;
        limit_req_status 429;
        auth_request /_admin_session;
        auth_request_set $iptv_admin_auth $upstream_http_x_admin_user;
        error_page 401 = @admin_signin;
        proxy_pass http://unix:/var/run/iptv_donate/donate.sock;
        proxy_set_header X-Admin-User $iptv_admin_auth;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        # Open to anyone: the sign-in page and its files, the owner's note on
        # the site's pages (news - donate.py answers only a valid session
        # cookie, anyone else an empty 204), the service worker that shows
        # notifications and the app manifest. A worker or a manifest asked
        # for behind a sign-in fails to load.
        location ~ ^/admin/(?:login|login\.js|passkey\.js|admin\.css|news|sw\.js|app\.webmanifest)$ {
            auth_request off;
            proxy_pass http://unix:/var/run/iptv_donate/donate.sock;
            proxy_set_header X-Admin-User "";
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Cache-Control "no-cache" always;
        }
    }
    # Signing in, taking up an invite, signing out: open, and counted.
    location ^~ /admin/auth/ {
        limit_req zone=iptv_signin burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://unix:/var/run/iptv_donate/donate.sock;
        proxy_set_header X-Admin-User "";
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }
    # Not signed in: the page itself goes to the sign-in page; its data and
    # files answer 401, and the page's script goes there too.
    location @admin_signin {
        if ($uri = /admin/) {
            return 302 /admin/login;
        }
        return 401;
    }
    # The session check behind auth_request: only nginx asks it.
    location = /_admin_session {
        internal;
        proxy_pass http://unix:/var/run/iptv_donate/donate.sock:/admin-session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # -- static files -----------------------------------------------------------

    # Long-cache the immutable release files, and ALWAYS serve them as a binary
    # download. Without this, extensions nginx's mime.types doesn't know
    # (.AppImage, .deb, …) fall back to `default_type text/html`, so the browser
    # tries to *render* the binary instead of downloading it - clicking a
    # download then appears to "do nothing".
    location /files/ {
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    # Every page links CSS and JS with the file's content hash in the URL
    # (?v=..., worked out by sync-releases.sh): a changed file gets a new URL,
    # so the old one can be cached for good.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Images, fonts and the manifest keep their names when they change: a week.
    location ~* \.(svg|png|ico|webp|webmanifest|woff2)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }

    # No PHP is served from here. A .php file left behind by an old deploy is
    # not run and not shown either: it does not exist.
    location ~ \.php$ {
        return 404;
    }
}
