# TLS-front proxy - front for dopeiptv.org, the site's address since
# November 2026. The old iptv.dope.rs only sends visitors on: see
# proxy-iptv.dope.rs.conf.
# Place at: /usr/local/etc/nginx/conf.d/dopeiptv.org.conf
#
# 1) A CSP row for this host in the `map $server_name $csp_policy` block in
#    /usr/local/etc/nginx/nginx.conf - the same policy as iptv.dope.rs's
#    (see csp.snippet.txt), under the new name:
#
#    "dopeiptv.org" "default-src 'self'; img-src 'self' data: https://*.stripe.com; style-src 'self'; script-src 'self' https://js.stripe.com https://*.js.stripe.com; connect-src 'self' https://api.stripe.com https://checkout.stripe.com; frame-src https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://checkout.stripe.com https://pay.google.com; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';";
#
# 2) The certificate, for both names (DEPLOY.md, "Moving to dopeiptv.org"):
#      certbot certonly --webroot -w /usr/local/www/letsencrypt \
#        -d dopeiptv.org -d www.dopeiptv.org

server {
    listen 0.0.0.0:443 ssl;
    http2 on;
    server_name dopeiptv.org;

    ssl_certificate     /usr/local/etc/letsencrypt/live/dopeiptv.org/fullchain.pem;
    ssl_certificate_key /usr/local/etc/letsencrypt/live/dopeiptv.org/privkey.pem;

    # Who shares an address - a phone network (CGNAT), a school, an office,
    # a household - must never be turned away for being many. The files a
    # page is made of (styles, scripts, fonts, pictures, the release list the
    # app checks) are cheap for nginx and are not counted at all; the pages
    # themselves have a generous allowance, and what the services behind
    # answer (/donate/, /feedback/, /admin/, /hit) has a limit of its own
    # on the content host. A request over a limit is told 429 (slow down),
    # never 503 (which reads as the site being down).
    location ~* \.(?:css|js|mjs|svg|png|jpe?g|webp|avif|gif|ico|woff2?|ttf|webmanifest|json|txt|xml|map)$ {
        proxy_pass http://CONTENT_HOST:8081;   # <-- the same address as below
        limit_conn conn_limit 64;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
    }

    location / {
        proxy_pass http://CONTENT_HOST:8081;   # <-- the same address as iptv.dope.rs used

        limit_req  zone=general burst=60 nodelay;
        limit_req_status 429;
        limit_conn conn_limit 64;
        limit_conn_status 429;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
    }
}

# www is the same site under one address: a permanent move, path and query
# kept.
server {
    listen 0.0.0.0:443 ssl;
    http2 on;
    server_name www.dopeiptv.org;

    ssl_certificate     /usr/local/etc/letsencrypt/live/dopeiptv.org/fullchain.pem;
    ssl_certificate_key /usr/local/etc/letsencrypt/live/dopeiptv.org/privkey.pem;

    return 301 https://dopeiptv.org$request_uri;
}

# Plain http:// to the one https:// address; the certificate's renewals
# answer here.
server {
    listen 0.0.0.0:80;
    server_name dopeiptv.org www.dopeiptv.org;

    location /.well-known/acme-challenge/ { root /usr/local/www/letsencrypt; }
    location / { return 301 https://dopeiptv.org$request_uri; }
}
