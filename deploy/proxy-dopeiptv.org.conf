# TLS-front proxy - front for dopeiptv.org, the site's address since
# November 2026. The old iptv.dope.rs only sends visitors on: see
# proxy-iptv.dope.rs.conf.
# Place at: /usr/local/etc/nginx/conf.d/dopeiptv.org.conf
#
# 1) A CSP row for this host in the `map $server_name $csp_policy` block in
#    /usr/local/etc/nginx/nginx.conf - the same policy as iptv.dope.rs's
#    (see csp.snippet.txt), under the new name:
#
#    "dopeiptv.org" "default-src 'self'; img-src 'self' data: https://*.stripe.com; style-src 'self'; script-src 'self' https://js.stripe.com https://*.js.stripe.com; connect-src 'self' https://api.stripe.com https://checkout.stripe.com; frame-src https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://checkout.stripe.com https://pay.google.com; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';";
#
# 2) The certificate, for both names (DEPLOY.md, "Moving to dopeiptv.org"):
#      certbot certonly --webroot -w /usr/local/www/letsencrypt \
#        -d dopeiptv.org -d www.dopeiptv.org
#
# 3) The security headers below are this server's own, on every answer
#    (always: a 404 or a 502 too). nginx gives a server the http block's
#    add_header lines only while the server has none of its own, so the
#    CSP from the map is named here again - and any other add_header line
#    in nginx.conf's http block that this site should send must be added
#    here as well (`grep -n add_header /usr/local/etc/nginx/nginx.conf`).

# Where the address may not leave the site: the admin pages, the support
# page (Stripe sends people back to it with their checkout's id) and the
# Trakt sign-in's way back to the app.
map $uri $dopeiptv_referrer {
    default              "strict-origin-when-cross-origin";
    ~^/admin(?:/|$)      "no-referrer";
    ~^/support(?:/|$)    "no-referrer";
    ~^/trakt/            "no-referrer";
}

server {
    listen 0.0.0.0:443 ssl;
    http2 on;
    server_name dopeiptv.org;

    # Nothing of who asked what is written down here (the privacy policy,
    # section 9): no access log, and the error log only for what stops the
    # server - a refused or broken request would name its address. The
    # content server keeps what the statistics read, for two days.
    access_log off;
    error_log /var/log/nginx/error.log crit;

    ssl_certificate     /usr/local/etc/letsencrypt/live/dopeiptv.org/fullchain.pem;
    ssl_certificate_key /usr/local/etc/letsencrypt/live/dopeiptv.org/privkey.pem;

    # https only, for a year, the names under it too, as the proxy's http
    # block says for every site; never in a frame of another site; a file's type is
    # what it is sent as, never guessed (a download is never run as a
    # script); the address kept to the site where it says so (the map).
    add_header Content-Security-Policy   $csp_policy always;
    add_header Content-Security-Policy   "frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           $dopeiptv_referrer always;
    proxy_hide_header Referrer-Policy;

    # Who shares an address - a phone network (CGNAT), a school, an office,
    # a household - must never be turned away for being many. The files a
    # page is made of (styles, scripts, fonts, pictures, the release list the
    # app checks) are cheap for nginx and are not counted at all; the pages
    # themselves have a generous allowance, and what the services behind
    # answer (/donate/, /feedback/, /admin/, /hit) has a limit of its own
    # on the content host. A request over a limit is told 429 (slow down),
    # never 503 (which reads as the site being down).
    location ~* \.(?:css|js|mjs|svg|png|jpe?g|webp|avif|gif|ico|woff2?|ttf|webmanifest|json|txt|xml|map)$ {
        proxy_pass http://CONTENT_HOST:8081;   # <-- the same address as below
        limit_conn conn_limit 64;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
    }

    # Settings sync from the app (donate/sync.py): a body of up to 3 MB
    # (nginx's default is 1 MB), and not logged - a slot and an address
    # together would say which computers belong together. The content host
    # limits the rate.
    location ^~ /sync/ {
        proxy_pass http://CONTENT_HOST:8081;   # <-- the same address as below
        client_max_body_size 3m;
        access_log off;
        limit_conn conn_limit 64;
        limit_conn_status 429;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
    }

    # Watch together from the app (donate/together.py): a request waits up
    # to 25 s for the room's next message, so the read timeout is longer
    # than that and nothing is buffered; not logged - a room and the
    # addresses in it would say who watches with whom. The content host
    # limits the rate; a long poll holds a connection, hence limit_conn.
    location ^~ /together/ {
        proxy_pass http://CONTENT_HOST:8081;   # <-- the same address as below
        client_max_body_size 4k;
        access_log off;
        proxy_read_timeout 50s;
        proxy_buffering off;
        limit_conn conn_limit 64;
        limit_conn_status 429;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
    }

    location / {
        proxy_pass http://CONTENT_HOST:8081;   # <-- the same address as iptv.dope.rs used

        limit_req  zone=general burst=60 nodelay;
        limit_req_status 429;
        limit_conn conn_limit 64;
        limit_conn_status 429;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
    }
}

# www is the same site under one address: a permanent move, path and query
# kept.
server {
    listen 0.0.0.0:443 ssl;
    http2 on;
    server_name www.dopeiptv.org;

    # Nothing of who asked what is written down here (the privacy policy,
    # section 9): no access log, and the error log only for what stops the
    # server - a refused or broken request would name its address. The
    # content server keeps what the statistics read, for two days.
    access_log off;
    error_log /var/log/nginx/error.log crit;

    ssl_certificate     /usr/local/etc/letsencrypt/live/dopeiptv.org/fullchain.pem;
    ssl_certificate_key /usr/local/etc/letsencrypt/live/dopeiptv.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    return 301 https://dopeiptv.org$request_uri;
}

# Plain http:// to the one https:// address; the certificate's renewals
# answer here.
server {
    listen 0.0.0.0:80;
    server_name dopeiptv.org www.dopeiptv.org;

    # Nothing of who asked what is written down here (the privacy policy,
    # section 9): no access log, and the error log only for what stops the
    # server - a refused or broken request would name its address. The
    # content server keeps what the statistics read, for two days.
    access_log off;
    error_log /var/log/nginx/error.log crit;

    location /.well-known/acme-challenge/ { root /usr/local/www/letsencrypt; }
    location / { return 301 https://dopeiptv.org$request_uri; }
}
