# Flatpak manifest for dopeIPTV - Flathub-ready (fully offline build).
#
# Strategy: build libmpv (+ libplacebo + libass) from source on the
# freedesktop runtime, then pip-install the app and its Python deps from
# vendored wheels declared as sources (no network at build time - Flathub
# requirement). Runtime network (--share=network in finish-args) is kept: the
# app streams IPTV, which needs it.
#
# The Python wheels below are pinned to Python 3.13 / manylinux, matching the
# 25.08 runtime (24.08 reached end of life). Regenerate them by re-running the pip download used to
# produce this list when bumping deps (see the CONTRIBUTING/flatpak notes).
#
# The libmpv/libplacebo/libass recipe mirrors Celluloid's known-good Flathub
# manifest, so the fiddly media stack builds reliably.
app-id: io.github.slimture.dopeIPTV
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: dopeiptv

# What the sandbox lets the app do - each line with what needs it, and
# nothing that nothing needs.
finish-args:
  # Runtime network: the app streams IPTV, and finds and casts to devices
  # at home (its own sockets: mDNS, SSDP, the cast and remote servers).
  - --share=network
  # X11's shared memory, for the fallback below.
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  # GPU access for mpv's OpenGL render path (no other device: not all).
  - --device=dri
  # Recordings, local files and their folders, playlists and backups live
  # where the person keeps them under their home, and the app reads and
  # writes them by path (not only through the portal), so it needs home
  # access. The widest line here: narrowing it means opening every such
  # folder through the portal instead.
  - --filesystem=home
  # Inhibit the screensaver while a video plays (core/wakelock.py, on the
  # session bus). The app never talks to logind: the two login1 lines that
  # stood here let it ask the system to suspend or power off, for nothing.
  - --talk-name=org.freedesktop.ScreenSaver
  # The desktop's media controls (MPRIS; a second copy takes an .instance
  # name of its own) and the new-episode notifications.
  - --own-name=org.mpris.MediaPlayer2.dopeiptv
  - --own-name=org.mpris.MediaPlayer2.dopeiptv.*
  - --talk-name=org.freedesktop.Notifications
  - --env=LC_NUMERIC=C

# Full ffmpeg from the runtime extension (mpv links the SDK's ffmpeg at build
# time; this provides the complete codec set at runtime).
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '25.08'
    add-ld-path: .
    autodelete: false

cleanup-commands:
  - mkdir -p /app/lib/ffmpeg

modules:
  # --- libass (subtitle rendering for mpv) ---
  - name: libass
    cleanup:
      - /include
      - /lib/*.la
      - /lib/pkgconfig
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
        sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc

  # --- libplacebo (required by mpv's GPU/GL render path) ---
  - name: libplacebo
    buildsystem: meson
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  # --- libmpv ---
  - name: mpv
    buildsystem: meson
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
      - /share/bash-completion
      - /share/zsh
      - /share/doc
      - /share/applications
      - /share/icons
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dbuild-date=false
      - -Dalsa=disabled
      - -Dlua=disabled
      - -Djavascript=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209

  # --- Kerberos' GSSAPI library: Qt's network library (QtNetwork - the
  #     socket a second start hands its command over) links
  #     libgssapi_krb5, which the freedesktop runtime does not carry; from
  #     1.5.0 on every start crashed on it (#36) ---
  - name: krb5
    subdir: src
    build-options:
      # krb5 1.21 declares functions the old way (`void f();`), which C23 -
      # GCC 15's default - reads as taking no arguments: it does not build.
      cflags: -std=gnu17
    config-opts:
      - --disable-static
      - --disable-rpath
      - --localstatedir=/var/lib
    cleanup:
      - /bin
      - /sbin
      - /include
      - /lib/pkgconfig
      - /share
      - /var
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.21/krb5-1.21.3.tar.gz
        sha256: b7a4cd5ead67fb08b980b21abd150ff7217e85ea320c9ed0c6dadd304840ad35

  # --- the dopeIPTV app + its Python deps, all from vendored wheels ---
  - name: dopeiptv
    buildsystem: simple
    build-commands:
      # Offline: install the runtime deps and build/install the app from the
      # wheels fetched into the build dir as sources (no --share=network).
      - pip3 install --no-index --find-links="${PWD}" --prefix=${FLATPAK_DEST}
        PyQt6 requests python-mpv pychromecast .
      # Every Qt module the app imports must load with what the runtime
      # and this bundle carry - a library one of them needs and nothing
      # here has stopped the build, not every start (#36).
      # tests/test_flatpak_manifest.py keeps this list to the code's own.
      - PYTHONPATH="$(echo ${FLATPAK_DEST}/lib/python3*/site-packages)" python3 -c
        "import PyQt6.QtCore, PyQt6.QtGui, PyQt6.QtWidgets, PyQt6.QtNetwork, PyQt6.QtDBus, PyQt6.QtOpenGL, PyQt6.QtOpenGLWidgets"
      - install -Dm644 packaging/io.github.slimture.dopeIPTV.desktop
        ${FLATPAK_DEST}/share/applications/io.github.slimture.dopeIPTV.desktop
      - install -Dm644 packaging/io.github.slimture.dopeIPTV.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/io.github.slimture.dopeIPTV.metainfo.xml
      # Every rendered size, not just 256: a 32 px panel downscaling the
      # big one is why the icon looked soft beside sharp system icons.
      # These carry the same ~10% margin the app draws at runtime - GNOME
      # asks for the icon to occupy about 80% of its canvas, and a
      # full-bleed one stands a quarter larger than everything beside it.
      # tests/test_packaging_icons.py fails if they drift from the code
      # that draws them.
      - for s in 256 128 64 48 32; do
        install -Dm644 "packaging/icons/io.github.slimture.dopeIPTV-$s.png"
        "${FLATPAK_DEST}/share/icons/hicolor/${s}x${s}/apps/io.github.slimture.dopeIPTV.png";
        done
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/df/b2/87e62e8c3e2f4b32e5fe99e0b86d576da1312593b39f47d8ceef365e95ed/packaging-26.2-py3-none-any.whl
        sha256: 5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e
      - type: file
        url: https://files.pythonhosted.org/packages/ef/55/6dc6d6bb953bdfc52519a0059592c52b6e3b8ad51cf8256dffceb55b0610/setuptools-84.2.1-py3-none-any.whl
